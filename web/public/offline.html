<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A10" />
    <meta name="color-scheme" content="dark light" />
    <title>Broadwave</title>
    <script>
      // The app's own appearance: the saved choice, or the device when it is System. Unset is dark.
      (function () {
        var theme = "dark";
        var accent = "blue";
        try {
          theme = localStorage.getItem("broadwave-theme") || "dark";
          accent = localStorage.getItem("broadwave-accent") || "blue";
        } catch (e) {}
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (theme !== "light") theme = "dark";
        var inks = {
          blue: ["#3D7BFF", "#1D4ED8"],
          teal: ["#2DD4BF", "#0D6962"],
          green: ["#34D399", "#0D6B3D"],
          orange: ["#FB923C", "#A7380A"],
          purple: ["#A78BFA", "#6D28D9"],
          rose: ["#FB7185", "#B8113A"],
        };
        var ink = inks[accent] || inks.blue;
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.setProperty("--accent", theme === "light" ? ink[1] : ink[0]);
        root.style.setProperty("--on-accent", theme === "light" || accent === "blue" ? "#fff" : "#0b0f16");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#F4F6FA" : "#070A10");
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #070a10;
        --card: #0e131c;
        --line: rgba(255, 255, 255, 0.08);
        --text: #f5f7fa;
        --text2: #aeb7c5;
        --text3: #828fa2;
        --accent: #3d7bff;
        --on-accent: #fff;
        --glow-a: rgba(61, 123, 255, 0.16);
        --glow-b: rgba(139, 92, 246, 0.13);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --canvas: #f4f6fa;
        --card: #ffffff;
        --line: rgba(20, 24, 32, 0.1);
        --text: #141820;
        --text2: #3e4858;
        --text3: #5b6575;
        --glow-a: rgba(61, 123, 255, 0.12);
        --glow-b: rgba(139, 92, 246, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
        background:
          radial-gradient(1100px 700px at 8% -10%, var(--glow-a), transparent 60%),
          radial-gradient(900px 600px at 100% 0%, var(--glow-b), transparent 60%),
          var(--canvas);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(560px, 100%);
        padding: clamp(24px, 5vw, 40px);
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
      }
      .tally {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff3b30;
        box-shadow: 0 0 12px rgba(255, 59, 48, 0.7);
      }
      h1 {
        margin: 18px 0 10px;
        font-size: clamp(26px, 4vw, 38px);
        line-height: 1.1;
        letter-spacing: -0.03em;
        overflow-wrap: anywhere;
      }
      p {
        margin: 0;
        color: var(--text2);
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.45;
      }
      .status {
        margin-top: 14px;
        font-size: 15px;
        color: var(--text3);
      }
      button {
        margin-top: 24px;
        min-height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 18px;
        font-weight: 650;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 4px solid var(--accent);
        outline-offset: 4px;
      }
      @media (min-width: 1100px) and (pointer: coarse) {
        main {
          width: min(880px, 100%);
        }
        h1 {
          font-size: 54px;
        }
        p {
          font-size: 26px;
        }
        button {
          min-height: 64px;
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tally" aria-hidden="true"></div>
      <h1 id="title">Can't reach Broadwave</h1>
      <p>Check that the server is on and this device is on the same network. This page tries again on its own.</p>
      <p class="status" id="status" role="status"></p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      (function () {
        try {
          var name = localStorage.getItem("broadwave.serverName");
          if (name) document.getElementById("title").textContent = "Can't reach " + name;
        } catch (e) {}
        var retry = document.getElementById("retry");
        var status = document.getElementById("status");
        retry.focus();
        retry.addEventListener("click", function () {
          location.replace("/");
        });
        // Back to the app as soon as the server answers.
        function check() {
          fetch("/api/v1/server", { cache: "no-store" })
            .then(function (res) {
              if (res.ok) location.replace("/");
            })
            .catch(function () {
              status.textContent = "Still not answering. Checked at " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".";
            });
        }
        addEventListener("online", check);
        setInterval(check, 10000);
      })();
    </script>
  </body>
</html>
