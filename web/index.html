<!doctype html>
<html lang="en" data-layout="desktop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A10" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Broadwave</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("broadwave-theme");
          var accent = localStorage.getItem("broadwave-accent");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var mode = theme === "light" || (theme === "system" && !dark) ? "light" : "dark";
          var known = { blue: 1, teal: 1, green: 1, orange: 1, purple: 1, rose: 1 };
          var root = document.documentElement;
          root.setAttribute("data-theme", mode);
          root.setAttribute("data-accent", known[accent] ? accent : "blue");
          var color = document.querySelector('meta[name="theme-color"]');
          if (color) color.setAttribute("content", mode === "light" ? "#F4F6FA" : "#070A10");
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute("content", mode);
          var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (bar) bar.setAttribute("content", mode === "light" ? "default" : "black-translucent");
        } catch (e) {}
      })();
      // The bundles load from /assets at the root of the address. Behind a
      // proxy at a path (example.com/broadwave) they miss, and the page would
      // stay blank.
      window.addEventListener(
        "error",
        function (e) {
          var el = e.target;
          if (!el || el.tagName !== "SCRIPT" || (el.src || "").indexOf(location.origin + "/assets/") !== 0) return;
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.setAttribute("role", "alert");
          root.style.cssText = "max-width:34rem;margin:20vh auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif";
          root.textContent =
            "Broadwave didn't load. Reload the page. Through a reverse proxy, Broadwave needs a name of its own, such as tv.example.com, not a path such as example.com/broadwave.";
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
