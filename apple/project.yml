name: Broadwave
options:
  bundleIdPrefix: com.wolfeup
  deploymentTarget:
    iOS: "26.1"
    tvOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: D4MC63SS36
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  BroadwaveKit:
    path: Packages/BroadwaveKit
  BroadwaveUI:
    path: Packages/BroadwaveUI
targetTemplates:
  App:
    type: application
    sources:
      - path: App/Shared
    dependencies:
      - package: BroadwaveKit
      - package: BroadwaveUI
targets:
  Broadwave:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: Broadwave
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Broadwave finds your TV server on your home network.
        NSBonjourServices:
          - _broadwave._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wolfeup.broadwave
            CFBundleURLSchemes: [broadwave]
  BroadwaveTV:
    templates: [App]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave
        TARGETED_DEVICE_FAMILY: "3"
    info:
      path: App/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Broadwave
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Broadwave finds your TV server on your home network.
        NSBonjourServices:
          - _broadwave._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wolfeup.broadwave
            CFBundleURLSchemes: [broadwave]
