name: Broadwave
options:
  bundleIdPrefix: com.wolfeup
  deploymentTarget:
    iOS: "26.1"
    tvOS: "26.1"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: D4MC63SS36
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  BroadwaveKit:
    path: Packages/BroadwaveKit
  BroadwaveUI:
    path: Packages/BroadwaveUI
targetTemplates:
  App:
    type: application
    sources:
      - path: App/Shared
      - path: App/DemoMedia
        type: folder
    dependencies:
      - package: BroadwaveKit
      - package: BroadwaveUI
targets:
  Broadwave:
    templates: [App]
    platform: iOS
    sources:
      - path: App/Intents
    dependencies:
      - target: BroadwaveWidgets
      # Embedded under Watch/ ("Embed Watch Content").
      - target: BroadwaveWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave
        CODE_SIGN_ENTITLEMENTS: App/Keychain.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Broadwave
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSUserActivityTypes:
          - com.wolfeup.broadwave.watch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Broadwave finds your TV server on your home network.
        NSBonjourServices:
          - _broadwave._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wolfeup.broadwave
            CFBundleURLSchemes: [broadwave]
        BroadwaveKeychainGroup: $(AppIdentifierPrefix)com.wolfeup.broadwave.shared
  BroadwaveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Intents
    dependencies:
      - package: BroadwaveKit
      - package: BroadwaveUI
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/Keychain.entitlements
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Broadwave
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Broadwave finds your TV server on your home network.
        BroadwaveKeychainGroup: $(AppIdentifierPrefix)com.wolfeup.broadwave.shared
  BroadwaveWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
      # The message format the iPhone app answers; compiled here without the rest of the kit.
      - path: Packages/BroadwaveKit/Sources/BroadwaveKit/WatchRelay.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Broadwave
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wolfeup.broadwave
        WKRunsIndependentlyOfCompanionApp: false
  BroadwaveTV:
    templates: [App]
    platform: tvOS
    dependencies:
      - target: BroadwaveTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_ENTITLEMENTS: App/Keychain.entitlements
    info:
      path: App/Info-tvOS.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Broadwave
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Broadwave finds your TV server on your home network.
        NSBonjourServices:
          - _broadwave._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wolfeup.broadwave
            CFBundleURLSchemes: [broadwave]
        BroadwaveKeychainGroup: $(AppIdentifierPrefix)com.wolfeup.broadwave.shared
  BroadwaveTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: App/TopShelf
    dependencies:
      - package: BroadwaveKit
      - sdk: TVServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        # The tv-app-extension type links _TVExtensionMain, which returns at once on tvOS 27.
        LD_ENTRY_POINT: _NSExtensionMain
        CODE_SIGN_ENTITLEMENTS: App/Keychain.entitlements
    info:
      path: App/TopShelf/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Broadwave
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Broadwave finds your TV server on your home network.
        BroadwaveKeychainGroup: $(AppIdentifierPrefix)com.wolfeup.broadwave.shared
  BroadwaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Broadwave
      - package: BroadwaveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave.ui
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  BroadwaveTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - App/TVUITests
      - App/UITests
    dependencies:
      - target: BroadwaveTV
      - package: BroadwaveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.broadwave.tvui
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Broadwave:
    build:
      targets:
        Broadwave: all
        BroadwaveUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BroadwaveUITests
  BroadwaveTV:
    build:
      targets:
        BroadwaveTV: all
        BroadwaveTVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BroadwaveTVUITests
