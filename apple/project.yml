name: Waveguide
options:
  bundleIdPrefix: com.wolfeup
  deploymentTarget:
    iOS: "26.1"
    tvOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: D4MC63SS36
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  OTAKit:
    path: Packages/OTAKit
  OTAUI:
    path: Packages/OTAUI
targetTemplates:
  App:
    type: application
    sources:
      - path: App/Shared
    dependencies:
      - package: OTAKit
      - package: OTAUI
targets:
  Waveguide:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.waveguide
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: Waveguide
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Waveguide finds your TV server on your home network.
        NSBonjourServices:
          - _waveguide._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wolfeup.waveguide
            CFBundleURLSchemes: [waveguide]
  WaveguideTV:
    templates: [App]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfeup.waveguide
        TARGETED_DEVICE_FAMILY: "3"
    info:
      path: App/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Waveguide
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Waveguide finds your TV server on your home network.
        NSBonjourServices:
          - _waveguide._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.wolfeup.waveguide
            CFBundleURLSchemes: [waveguide]
