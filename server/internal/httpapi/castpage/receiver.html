<!DOCTYPE html>
<html lang="en" data-cast-receiver data-cast-state="idle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Broadwave</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  #cast-video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  #cast-idle, #cast-title { position: fixed; left: 0; right: 0; text-align: center; }
  #cast-idle { top: 45%; font-size: 1.25rem; }
  #cast-title { bottom: 8%; font-size: 1.5rem; }
  [hidden] { display: none; }
</style>
</head>
<body>
<video id="cast-video" playsinline></video>
<p id="cast-idle">This page plays on a Cast device.</p>
<p id="cast-title" hidden></p>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script type="module" src="/cast/receiver.js"></script>
</body>
</html>
