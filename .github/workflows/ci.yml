name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: test -z "$(gofmt -l server)" || { gofmt -l server; exit 1; }
      - run: scripts/check-names.sh
      - run: go vet ./server/...
      - run: go test ./server/...
      - run: go test -race ./server/internal/live/ ./server/internal/hdhr/fake/
      - run: go run ./server/cmd/apigen -check
      - run: FAKE=1 scripts/relay-smoke.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: scripts/bundle-budget.sh
      - run: scripts/home-paint.sh

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint swiftformat
      - run: swiftlint lint --strict
      - run: swiftformat --lint .
      - run: make apple-test
      - run: make apple

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg sqlite3
      # Docker Hub refuses anonymous pulls from busy runner addresses (429).
      # Google's mirror serves the same official images; Docker Hub stays the fallback.
      - run: |
          f=/etc/docker/daemon.json
          if [ -s "$f" ]; then sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$f" > /tmp/daemon.json
          else echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json; fi
          sudo mv /tmp/daemon.json "$f" && sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'
      - run: docker build -f deploy/docker/Dockerfile -t broadwave:ci .
      - run: npm ci
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # The browser tests drive the built image: setup, guide, a channel
      # playing, two screens on one timeline, multiview, and a recording.
      - run: node e2e/prepare.mjs
        working-directory: web
      # The quad restart runs on its own below until the sound tile keeps its
      # picture there every time.
      # The budget is pinned to two pictures (3.1x, what three cores bench).
      # A slow runner benched one picture once and failed every two-tile
      # check.
      - run: npx playwright test --config e2e/playwright.config.ts 01-setup 02-browse 03-player-sync 04-multiview 14-recording 23-image 27-live-captions 31-audio-switch 36-quiet 40-remove-device 41-missing-file 42-guide-order 43-mini-guide 44-help-panel 45-home-notice 46-tv-focus 47-guide-now 49-passes 50-library 50-detect 51-episode-ends 52-break-skip 53-record-again 54-start-over 55-storage 56-game-alerts 57-file-end 58-mosaic 60-move --grep-invert "quad plays again"
        working-directory: web
        env:
          E2E_IMAGE: broadwave:ci
          E2E_SNAPSHOTS: skip
          E2E_SPEED: "3.1"
      # A slow machine's budget of two pictures, on its own port: the first
      # run's container can still hold 18731.
      - run: npx playwright test --config e2e/playwright.config.ts 01-setup 24-leave
        working-directory: web
        env:
          E2E_IMAGE: broadwave:ci
          E2E_SNAPSHOTS: skip
          E2E_SPEED: "3.1"
          E2E_PORT: "18751"
      # A channel with two sound tracks: the player loads the master, still
      # starts on the room's frame, and switches sound in place.
      - run: npx playwright test --config e2e/playwright.config.ts 01-setup 03-player-sync 31-audio-switch
        working-directory: web
        env:
          E2E_IMAGE: broadwave:ci
          E2E_SNAPSHOTS: skip
          E2E_TRACKS: "2"
          E2E_PORT: "18755"
          E2E_SPEED: "3.1"
      # A quad on a two-picture server after a restart, on a fresh server.
      - run: npx playwright test --config e2e/playwright.config.ts 01-setup 04-multiview -g "setup wizard|quad plays again"
        working-directory: web
        env:
          E2E_IMAGE: broadwave:ci
          E2E_SNAPSHOTS: skip
          E2E_PORT: "18753"
          E2E_SPEED: "3.1"
      # Encrypted 3.0 plays as its clear twin. A multiview link to a hidden half
      # plays the channel on the guide. Own port: the steps above can still
      # hold 18731, and this lineup is the FLEX-4K profile.
      - run: npx playwright test --config e2e/playwright.config.ts 37-atsc3 38-atsc3-tv 39-atsc3-mv
        working-directory: web
        env:
          E2E_IMAGE: broadwave:ci
          E2E_SNAPSHOTS: skip
          E2E_ATSC3: "1"
          E2E_PORT: "18757"
          E2E_SPEED: "3.1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-image
          include-hidden-files: true
          path: |
            web/e2e/.run/server.log
            web/e2e/.run/test-results
            web/e2e/.run/*-actual.jpg
          retention-days: 7

  apple-e2e:
    runs-on: macos-26
    needs: [apple]
    timeout-minutes: 60
    # Not a gate yet: on the hosted runner the iPhone player can sit behind its
    # room without correcting, and the tvOS guide rows can refuse focus.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install xcodegen ffmpeg
      - run: npm ci
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # iPhone and Apple TV simulators against a fresh server with the fake
      # tuner: find it, finish setup, guide, a channel playing in step with
      # Chrome, a recording, and two channels side by side.
      - run: scripts/e2e-apple.sh
        env:
          E2E_OUT: ${{ runner.temp }}/apple-e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-e2e
          path: ${{ runner.temp }}/apple-e2e
          retention-days: 7
