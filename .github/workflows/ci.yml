name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: test -z "$(gofmt -l server)" || { gofmt -l server; exit 1; }
      - run: scripts/check-names.sh
      - run: go vet ./server/...
      - run: go test ./server/...
      - run: go run ./server/cmd/apigen -check
      - run: FAKE=1 scripts/relay-smoke.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint swiftformat
      - run: swiftlint lint --strict
      - run: swiftformat --lint .
      - run: make apple-test
      - run: make apple

  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t broadwave:ci .
