name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: docs/sitegen/go.mod

      - name: Build the handbook
        working-directory: docs/sitegen
        run: go run . -out dist

      # The marketing site stays at the root; the handbook is docs/.
      - name: Stage marketing site and handbook
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/pages"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a site/. "$stage/"
          rm -rf "$stage/docs"
          mkdir -p "$stage/docs"
          cp -a docs/sitegen/dist/. "$stage/docs/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

      - id: deployment
        uses: actions/deploy-pages@v4
