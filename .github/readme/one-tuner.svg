<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="One antenna and one tuner feed a Broadwave server that plays the same frame on every screen in the house">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#0F1830"/><stop offset="1" stop-color="#070A10"/></radialGradient>
  <linearGradient id="pic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3D7BFF"><animate attributeName="stop-color" values="#3D7BFF;#A26BFF;#FF7A59;#3D7BFF" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#0B1222"/>
  </linearGradient>
  <linearGradient id="srv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1B2A4F"/><stop offset="1" stop-color="#101829"/></linearGradient>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="big" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1280" height="560" rx="28" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1279" height="559" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

<!-- antenna -->
<g transform="translate(120 280)">
  <path d="M-18,-60 A30,30 0 0 1 18,-60" fill="none" stroke="#3D7BFF" stroke-width="3" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.00s" repeatCount="indefinite"/></path><path d="M-42,-84 A59,59 0 0 1 42,-84" fill="none" stroke="#3D7BFF" stroke-width="3" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.30s" repeatCount="indefinite"/></path><path d="M-66,-108 A88,88 0 0 1 66,-108" fill="none" stroke="#3D7BFF" stroke-width="3" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.60s" repeatCount="indefinite"/></path>
  <path d="M0,-52 L-30,50 M0,-52 L30,50 M-20,20 L20,20 M-11,-12 L11,-12 M-25,36 L25,36" stroke="#CFE0FF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="0" cy="-58" r="7" fill="#FF3B30" filter="url(#g)"><animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="0" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F5F7FA">Your antenna</text>
  <text x="0" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#737E8F">free, over the air</text>
</g>
<path id="a" d="M170,280 L300,280" stroke="#3D7BFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
<circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>

<!-- tuner -->
<g transform="translate(300 250)">
  <rect width="150" height="60" rx="12" fill="#131A28" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <circle cx="24" cy="30" r="5" fill="#32D74B"/><circle cx="42" cy="30" r="5" fill="#32D74B" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/></circle>
  <text x="62" y="36" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#AEB7C5">TUNER</text>
  <text x="75" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F5F7FA">One tuner</text>
  <text x="75" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#737E8F">HDHomeRun and friends</text>
</g>
<path id="b2" d="M450,280 L530,280" stroke="#3D7BFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
<circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>

<!-- server -->
<ellipse cx="640" cy="280" rx="130" ry="90" fill="#3D7BFF" opacity="0.25" filter="url(#big)"><animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/></ellipse>
<g transform="translate(530 224)">
  <rect width="220" height="112" rx="20" fill="url(#srv)" stroke="#3D7BFF" stroke-opacity="0.7" stroke-width="1.5"/>
  <g transform="translate(22 30) scale(0.05)" fill="none" stroke-linecap="round" stroke-width="80">
    <path d="M0,560 C170,860 340,160 512,420 S850,800 1024,380" stroke="#B8D0FF"/>
    <path d="M0,700 C170,900 340,300 512,400 S850,780 1024,420" stroke="#3D7BFF"/>
  </g>
  <text x="80" y="52" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#F5F7FA">Broadwave</text>
  <text x="80" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#AEB7C5">on your server</text>
  <text x="22" y="98" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6F9BFF">Docker · Unraid · Linux</text>
</g>

<path id="p0" d="M750,280 C860,280 750,116.0 870,116.0" fill="none" stroke="#3D7BFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/><path id="p1" d="M750,280 C860,280 980,104.5 1100,104.5" fill="none" stroke="#3D7BFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/><path id="p2" d="M750,280 C860,280 750,347.5 870,347.5" fill="none" stroke="#3D7BFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/><path id="p3" d="M750,280 C860,280 1010,334.0 1130,334.0" fill="none" stroke="#3D7BFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle r="5" fill="#9CC0FF" filter="url(#g)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

  <g>
    <rect x="864" y="54" width="212" height="124" rx="14" fill="#11151E" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <svg x="870" y="60" width="200" height="112" viewBox="0 0 200 112" preserveAspectRatio="none">
      <rect width="200" height="112" rx="8" fill="url(#pic)"/>
      <rect y="0" width="36" height="112" fill="#FFFFFF" fill-opacity="0.18">
        <animate attributeName="x" values="-40;200" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="186" cy="12" r="4" fill="#FF3B30"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
    </svg>
    <text x="870" y="198" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F7FA">Apple TV</text>
    <text x="870" y="217" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#737E8F">Living room</text>
  </g>
  <g>
    <rect x="1094" y="46" width="152" height="117" rx="14" fill="#11151E" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <svg x="1100" y="52" width="140" height="105" viewBox="0 0 140 105" preserveAspectRatio="none">
      <rect width="140" height="105" rx="8" fill="url(#pic)"/>
      <rect y="0" width="25" height="105" fill="#FFFFFF" fill-opacity="0.18">
        <animate attributeName="x" values="-28;140" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="126" cy="12" r="4" fill="#FF3B30"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
    </svg>
    <text x="1100" y="183" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F7FA">iPad</text>
    <text x="1100" y="202" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#737E8F">Kitchen</text>
  </g>
  <g>
    <rect x="864" y="284" width="212" height="127" rx="14" fill="#11151E" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <svg x="870" y="290" width="200" height="115" viewBox="0 0 200 115" preserveAspectRatio="none">
      <rect width="200" height="115" rx="8" fill="url(#pic)"/>
      <rect y="0" width="36" height="115" fill="#FFFFFF" fill-opacity="0.18">
        <animate attributeName="x" values="-40;200" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="186" cy="12" r="4" fill="#FF3B30"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
    </svg>
    <text x="870" y="431" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F7FA">Browser</text>
    <text x="870" y="450" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#737E8F">Office</text>
  </g>
  <g>
    <rect x="1124" y="256" width="84" height="156" rx="14" fill="#11151E" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <svg x="1130" y="262" width="72" height="144" viewBox="0 0 72 144" preserveAspectRatio="none">
      <rect width="72" height="144" rx="8" fill="url(#pic)"/>
      <rect y="0" width="13" height="144" fill="#FFFFFF" fill-opacity="0.18">
        <animate attributeName="x" values="-14;72" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="58" cy="12" r="4" fill="#FF3B30"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
    </svg>
    <text x="1130" y="432" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F7FA">iPhone</text>
    <text x="1130" y="451" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#737E8F">Bedroom</text>
  </g>

<text x="640.0" y="536" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#AEB7C5">Everyone on the same channel shares <tspan fill="#F5F7FA" font-weight="700">one tune</tspan>, and every room plays <tspan fill="#F5F7FA" font-weight="700">the same frame</tspan>.</text>
</svg>