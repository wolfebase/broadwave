<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="A DVR that gets sports. Follow a team, record every game, hide the score.">
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#8FB2FF" stop-opacity="0.30"/></linearGradient><clipPath id="clip"><rect width="600" height="380" rx="24"/></clipPath><linearGradient id="field" x1="0" x2="1"><stop offset="0" stop-color="#1E7A46"/><stop offset="1" stop-color="#0F4A2A"/></linearGradient><filter id="blurscore" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="8;8;0;0;8" keyTimes="0;.45;.5;.9;1" dur="6s" repeatCount="indefinite"/></feGaussianBlur></filter></defs>
<g clip-path="url(#clip)"><rect width="600" height="380" fill="#05070D"/><circle cx="120" cy="60" r="150" fill="#FF3B30" opacity="0.55" filter="url(#soft)"><animate attributeName="cx" values="120;180;120" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="60;90;60" dur="16.9s" repeatCount="indefinite"/></circle><circle cx="520" cy="240" r="140" fill="#8B5CF6" opacity="0.55" filter="url(#soft)"><animate attributeName="cx" values="520;460;520" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="240;220;240" dur="22.1s" repeatCount="indefinite"/></circle><rect width="600" height="380" fill="#05070D" opacity="0.55"/><g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect x="32" y="26" width="536" height="128" rx="16" fill="url(#field)"/>
<line x1="86" y1="26" x2="86" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="139" y1="26" x2="139" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="193" y1="26" x2="193" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="246" y1="26" x2="246" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="300" y1="26" x2="300" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="354" y1="26" x2="354" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="407" y1="26" x2="407" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="461" y1="26" x2="461" y2="154" stroke="#fff" stroke-opacity="0.16"/><line x1="514" y1="26" x2="514" y2="154" stroke="#fff" stroke-opacity="0.16"/>
<circle r="8" fill="#C98A4B" stroke="#fff" stroke-width="1.5"><animateMotion dur="3s" repeatCount="indefinite" path="M110,130 Q300,20 490,120"/></circle>
<g transform="translate(52 110)"><rect width="300" height="34" rx="10" fill="#05070D" fill-opacity="0.85"/><rect x="10" y="9" width="16" height="16" rx="4" fill="#3D7BFF"/><text x="34" y="23" font-size="14" font-weight="800" fill="#fff">HAWKS</text><rect x="140" y="9" width="16" height="16" rx="4" fill="#FFB340"/><text x="164" y="23" font-size="14" font-weight="800" fill="#fff">COMETS</text>
<g filter="url(#blurscore)"><text x="100" y="23" font-size="15" font-weight="900" fill="#fff">21</text><text x="238" y="23" font-size="15" font-weight="900" fill="#fff">17</text></g><text x="266" y="23" font-size="11" fill="#AEB7C5">Q4</text></g>
<g transform="translate(32 176)"><rect x="0" y="0" width="536" height="80" rx="16" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.2"/><circle cx="30" cy="40" r="9" fill="#FF3B30" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle><text x="52" y="36" font-size="16" font-weight="800" fill="#F5F7FA">Recording · game still on</text><text x="52" y="58" font-size="13" fill="#FFB3AE">Overtime? It keeps going until it's final.</text><text x="516" y="48" text-anchor="end" font-size="24" font-weight="900" fill="#FF6259">+18 min</text></g></g><text x="32" y="316" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#F5F7FA">A DVR that gets sports</text>
<text x="32" y="346" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#AEB7C5">Follow a team, record every game, hide the score.</text></g>
<rect x="0.5" y="0.5" width="599" height="379" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>