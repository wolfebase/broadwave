<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Game-aware DVR: a recording that extends while the game is on, with spoiler-safe scores">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17213A"/><stop offset="1" stop-color="#070A10"/></linearGradient>
  <linearGradient id="field" x1="0" x2="1"><stop offset="0" stop-color="#1E7A46"/><stop offset="1" stop-color="#0F4A2A"/></linearGradient>
  <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="0">
    <animate attributeName="stdDeviation" values="9;9;0;0;9" keyTimes="0;0.45;0.5;0.9;1" dur="6s" repeatCount="indefinite"/></feGaussianBlur></filter>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="640" height="380" rx="24" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="639" height="379" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <text x="32" y="48" font-size="13" font-weight="700" letter-spacing="2" fill="#FF6259">● LIVE · SPORTS</text>
  <!-- field -->
  <rect x="32" y="68" width="576" height="130" rx="14" fill="url(#field)"/>
  <line x1="90" y1="68" x2="90" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="147" y1="68" x2="147" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="205" y1="68" x2="205" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="262" y1="68" x2="262" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="320" y1="68" x2="320" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="378" y1="68" x2="378" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="435" y1="68" x2="435" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="493" y1="68" x2="493" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/><line x1="550" y1="68" x2="550" y2="198" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <circle r="7" fill="#C98A4B" stroke="#FFF" stroke-width="1.5"><animateMotion dur="3s" repeatCount="indefinite" path="M120,170 Q320,60 520,150"/></circle>
  <!-- score bug -->
  <g transform="translate(52 150)">
    <rect width="300" height="36" rx="10" fill="#070A10" fill-opacity="0.85"/>
    <rect x="8" y="9" width="18" height="18" rx="4" fill="#3D7BFF"/><text x="34" y="24" font-size="15" font-weight="700" fill="#F5F7FA">HAWKS</text>
    <rect x="140" y="9" width="18" height="18" rx="4" fill="#FFB340"/><text x="166" y="24" font-size="15" font-weight="700" fill="#F5F7FA">COMETS</text>
    <g filter="url(#blur)"><text x="100" y="24" font-size="16" font-weight="800" fill="#FFFFFF">21</text><text x="238" y="24" font-size="16" font-weight="800" fill="#FFFFFF">17</text></g>
    <text x="266" y="24" font-size="12" fill="#AEB7C5">Q4</text>
  </g>
  <text x="32" y="236" font-size="22" font-weight="800" fill="#F5F7FA">Harbor Hawks at Valley Comets</text>
  <text x="32" y="262" font-size="15" fill="#AEB7C5">Record every game · scores hidden until you look</text>
  <!-- rec chip -->
  <g transform="translate(32 290)">
    <rect width="576" height="58" rx="14" fill="#FF3B30" fill-opacity="0.12" stroke="#FF3B30" stroke-opacity="0.45"/>
    <circle cx="26" cy="29" r="8" fill="#FF3B30" filter="url(#g)"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="46" y="25" font-size="15" font-weight="700" fill="#F5F7FA">Recording · game still on</text>
    <text x="46" y="44" font-size="13" fill="#FFB3AE">Overtime? It keeps recording until it’s final.</text>
    <text x="556" y="36" text-anchor="end" font-size="20" font-weight="800" fill="#FF6259">+<tspan>18</tspan> min</text>
  </g>
</g>
</svg>