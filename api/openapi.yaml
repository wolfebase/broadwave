openapi: 3.1.0
info:
  title: Broadwave
  version: 1.0.0
  description: |
    Live TV and DVR server for HDHomeRun tuners. This document is the contract for the
    web app and the iOS and tvOS apps; generated clients come from it.

    Every route is served under `/api/v1`. The same routes are also mounted under `/api`
    for the current web app and will be removed once it moves to `/api/v1`.

    Errors use one envelope: `{"code": "tuners_busy", "message": "...", ...details}`.
    Tuner stream URLs and tuner DeviceAuth are never returned.
servers:
  - url: http://localhost:8477/api/v1
tags:
  - name: server
  - name: sources
  - name: channels
  - name: guide
  - name: live
  - name: recordings
  - name: dvr
  - name: virtuals
  - name: settings
paths:
  /health:
    get:
      tags: [server]
      operationId: health
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
  /server:
    get:
      tags: [server]
      operationId: getServer
      description: Identity and capabilities. Clients use `id` to recognize a paired server at a new address.
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
    patch:
      tags: [server]
      operationId: renameServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
      responses:
        "200":
          description: Updated server info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "400": { $ref: "#/components/responses/Error" }
  /clock:
    get:
      tags: [server]
      operationId: getClock
      description: Server time for a first clock-offset estimate. The socket's clock messages refine it.
      responses:
        "200":
          description: Server time
          content:
            application/json:
              schema:
                type: object
                required: [serverTime]
                properties:
                  serverTime: { type: number, description: "Unix milliseconds" }
  /ws:
    get:
      tags: [server]
      operationId: openSocket
      description: |
        WebSocket for live updates and Whole-Home Sync. Every frame is `{"type", "data"}`.

        Server to client: `hello` {serverTime}, `clock` {t0, t1}, `activity` (Event),
        `live.changed` (refetch tuners and sessions), `sources.found` {found}, `sync.state` (RoomState), `error` {code, message}.

        Client to server: `clock` {t0}, `sync.join` {room, channelId}, `sync.leave` {room},
        `sync.command` {room, action: play|pause|seek|live|latency, mediaTime, latency}.

        Rooms are `channel:<id>` (everyone on a channel, following live) or `group:<code>`
        (shared controls). At server time T a room shows media time
        `anchorMedia + (T - anchorServer) * rate`, where media time is the segment
        program date-time (Unix ms). See docs/decisions/0003-whole-home-sync.md.
      responses:
        "101":
          description: Switching to WebSocket
  /diagnostics:
    get:
      tags: [server]
      operationId: getDiagnostics
      description: Tuners and signal, encoder and ffmpeg, storage, guide freshness, what the relay is carrying, connected apps, and recent activity.
      responses:
        "200":
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /profile:
    get:
      tags: [server]
      operationId: getProfile
      responses:
        "200":
          description: The household profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
                  auth: { type: string }
  /devices:
    get:
      tags: [sources]
      operationId: listDevices
      responses:
        "200":
          description: Tuner and source devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
  /devices/health:
    get:
      tags: [sources]
      operationId: getDeviceHealth
      description: Model, firmware version, and signal lock for each tuner. Read only. This server does not install firmware.
      responses:
        "200":
          description: Tuner health
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceHealth" }
  /devices/{id}/scan:
    post:
      tags: [sources]
      operationId: startChannelScan
      description: Ask one tuner to scan for channels. This uses a tuner until the scan finishes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan started
          content:
            application/json:
              schema:
                type: object
                required: [scanning]
                properties:
                  scanning: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [sources]
      operationId: channelScanStatus
      description: How far the channel scan has gotten.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan progress
          content:
            application/json:
              schema:
                type: object
                required: [scanning, found]
                properties:
                  scanning: { type: boolean }
                  found: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /home:
    get:
      tags: [sources]
      operationId: listHome
      description: Tuners, screens, and servers on this network. Nothing is added.
      parameters:
        - in: query
          name: fresh
          schema: { type: string, enum: ["1"] }
          description: When 1, scan again instead of using the last few seconds.
      responses:
        "200":
          description: What this scan found, with one action each
          content:
            application/json:
              schema:
                type: object
                required: [places, tunerAddress, sharing]
                properties:
                  places:
                    type: array
                    items:
                      type: object
                      required: [id, group, kind, name, action]
                      properties:
                        id: { type: string }
                        group: { type: string, enum: [tuner, screen, server] }
                        kind: { type: string }
                        name: { type: string }
                        addr: { type: string }
                        action: { type: string, enum: [add, added, use, here, found] }
                        detail: { type: string }
                  tunerAddress: { type: string, description: "Host and port other apps add as an HDHomeRun." }
                  sharing: { type: boolean, description: "True when this server is acting as an HDHomeRun." }
  /sources/discover:
    post:
      tags: [sources]
      operationId: discoverSources
      description: Find HDHomeRun tuners by broadcast, or read one address. Reads the lineup only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ip: { type: string, description: "Host or host:port. Empty broadcasts." }
      responses:
        "200":
          description: Devices after the refresh
          content:
            application/json:
              schema:
                type: object
                required: [devices, found]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  found: { type: integer }
        "500": { $ref: "#/components/responses/Error" }
  /sources/look:
    post:
      tags: [sources]
      operationId: lookHarder
      description: Probe this network for tuners and servers. Does not open a tuner stream.
      responses:
        "200":
          description: Devices and servers that answered
          content:
            application/json:
              schema:
                type: object
                required: [found]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [kind, name, addr]
                      properties:
                        kind: { type: string }
                        name: { type: string }
                        addr: { type: string }
                        id: { type: string }
        "500": { $ref: "#/components/responses/Error" }
  /sources/free:
    get:
      tags: [sources]
      operationId: findFreeChannels
      description: Look for FastChannels, Pluto, and Samsung generators already on this network.
      responses:
        "200":
          description: Feeds that answered, or a short guide when none did
          content:
            application/json:
              schema:
                type: object
                required: [found, guide]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [kind, name, addr, playlist, guide]
                      properties:
                        kind: { type: string }
                        name: { type: string }
                        addr: { type: string }
                        playlist: { type: string }
                        guide: { type: string }
                  guide: { type: string }
    post:
      tags: [sources]
      operationId: addFreeChannels
      description: Add one generator feed as a tuner-free playlist. DRM streams are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                addr: { type: string }
                playlist: { type: string }
                guide: { type: string }
                name: { type: string }
      responses:
        "200":
          description: The source, plus a note when DRM channels were skipped
        "400": { $ref: "#/components/responses/Error" }
  /sources:
    get:
      tags: [sources]
      operationId: listSources
      responses:
        "200":
          description: M3U, stream link, and folder sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
    post:
      tags: [sources]
      operationId: addSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [m3u, xtream, tvheadend, channels, threadfin, xteve, ersatztv, dispatcharr, link, folder] }
                name: { type: string }
                url: { type: string, description: "Playlist URL, Xtream server, stream URL, or folder path" }
                username: { type: string }
                password: { type: string }
                xmltvUrl: { type: string }
                groups: { type: string, description: "Comma-separated group names. Prefix one with - to leave it out." }
                keep: { type: string, description: "Comma-separated channel names or tvg-ids to keep from a large playlist." }
                start: { type: integer, description: "First channel number. 0 keeps the numbers in the playlist." }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                name: { type: string }
                groups: { type: string }
                keep: { type: string }
                xmltvUrl: { type: string }
                file: { type: string, format: binary, description: "An M3U playlist. Gzip is unpacked." }
      responses:
        "200":
          description: Source added
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { $ref: "#/components/schemas/Source" }
                  added: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /channels:
    get:
      tags: [channels]
      operationId: listChannels
      parameters:
        - in: query
          name: guide
          schema: { type: string, enum: ["1"] }
          description: When 1, only channels that belong on the guide (present, enabled, not hidden).
      responses:
        "200":
          description: Lineup
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
  /channels/star:
    post:
      tags: [channels]
      operationId: starNetworkFavorites
      description: Favorite ABC, CBS, FOX, and NBC. The server picks the network from the guide, then from its call-sign table.
      responses:
        "200":
          description: Channels it marked favorite
          content:
            application/json:
              schema:
                type: object
                required: [starred]
                properties:
                  starred:
                    type: array
                    items:
                      type: object
                      required: [id, network]
                      properties:
                        id: { type: integer, format: int64 }
                        guideName: { type: string }
                        displayNumber: { type: string }
                        network: { type: string }
  /affiliations:
    get:
      tags: [channels]
      operationId: listAffiliations
      description: Call sign to network. The value is ABC, CBS, FOX, or NBC.
      responses:
        "200":
          description: The call-sign table
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                properties:
                  calls:
                    type: object
                    additionalProperties: { type: string }
  /channels/{id}:
    patch:
      tags: [channels]
      operationId: patchChannel
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelPatch" }
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "404": { $ref: "#/components/responses/Error" }
  /channels/{id}/frame:
    get:
      tags: [channels]
      operationId: channelFrame
      summary: Latest preview from a mux that is already tuned.
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: query
          name: w
          schema: { type: string, enum: ["480", "1280"] }
          description: 480 is the small frame. 1280 is the wide one. A missing size is not upscaled.
      responses:
        "200":
          description: JPEG preview. X-Frame-Stale is 1 when the picture is older than 10 minutes.
          headers:
            Last-Modified: { schema: { type: string } }
            X-Frame-Stale: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: No preview yet. Watching is not started to make one. }
  /airings:
    get:
      tags: [guide]
      operationId: listAirings
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: Start of the window. Defaults to 30 minutes ago.
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: End of the window. Defaults to 48 hours ahead when hours is omitted.
        - in: query
          name: channels
          schema: { type: string }
          description: Comma-separated channel ids. Omit for every channel.
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 168, default: 48 }
          description: How far ahead to return listings when to is omitted. Kept for older clients.
      responses:
        "200":
          description: Guide listings in the window
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [airings]
                properties:
                  airings:
                    type: array
                    items: { $ref: "#/components/schemas/Airing" }
  /guide/refresh:
    post:
      tags: [guide]
      operationId: refreshGuide
      responses:
        "200":
          description: Listings reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  airings: { type: integer }
        "429":
          description: Manual refresh is limited to once an hour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /search:
    get:
      tags: [guide]
      operationId: search
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Words to match in titles, descriptions, cast, and recordings.
      responses:
        "200":
          description: Upcoming listings and recordings that match
          content:
            application/json:
              schema:
                type: object
                required: [query, airings, recordings]
                properties:
                  query: { type: string }
                  airings:
                    type: array
                    items: { $ref: "#/components/schemas/SearchAiring" }
                  recordings:
                    type: array
                    items: { $ref: "#/components/schemas/Recording" }
        "500": { $ref: "#/components/responses/Error" }
  /sports/scoreboard:
    get:
      tags: [guide]
      operationId: scoreboard
      parameters:
        - in: query
          name: league
          schema: { type: string }
          description: nfl, ncaaf, nba, wnba, ncaab, mlb, nhl, mls, nwsl, epl, f1, or nascar. Blank asks for every league.
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Calendar day. Blank is today on the server.
      responses:
        "200":
          description: Games for the day
          content:
            application/json:
              schema:
                type: object
                required: [games]
                properties:
                  games:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /watch:
    post:
      tags: [live]
      operationId: watchChannel
      description: |
        Start or join live playback. Everyone on the same frequency shares one tuner.
        Send `caps` (what this device can play) and optional `prefs`; the server picks a
        rendition and explains the choice in `stream.reason`. `rendition` forces a specific
        one. `profile`/`audio`/`pictureMode` are the older web fields and still work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { type: integer, format: int64 }
                caps: { $ref: "#/components/schemas/Caps" }
                prefs: { $ref: "#/components/schemas/Prefs" }
                rendition: { type: string, description: "Force a rendition key, for example copy.copy or 720.aac2.broadcast" }
                profile: { type: string, enum: [transparent, balanced, saver], deprecated: true }
                audio: { type: string, enum: [stereo, surround], deprecated: true }
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
      responses:
        "200":
          description: Live session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchSession" }
        "409": { $ref: "#/components/responses/Error" }
  /watch/{id}/stop:
    post:
      tags: [live]
      operationId: stopWatching
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rendition: { type: string, description: "The rendition this viewer joined; empty releases from the busiest" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /multiview/plan:
    post:
      tags: [live]
      operationId: planMultiview
      description: |
        Which of these channels can play together. Channels on one frequency share a tuner.
        A channel with no known frequency needs a tuner of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelIds]
              properties:
                channelIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Tuner budget for the requested channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiviewPlan" }
        "400": { $ref: "#/components/responses/Error" }
  /signals:
    get:
      tags: [live]
      operationId: listSignals
      description: Last antenna reading for each channel, plus a live reading when that frequency is already tuned.
      responses:
        "200":
          description: Channel signals
          content:
            application/json:
              schema:
                type: object
                required: [channels, running]
                properties:
                  running: { type: boolean }
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelSignal" }
  /signals/check:
    post:
      tags: [live]
      operationId: checkSignals
      description: Tune each frequency on an idle tuner, read signal strength, and stop if someone starts watching.
      responses:
        "200":
          description: Check started
          content:
            application/json:
              schema:
                type: object
                required: [running]
                properties:
                  running: { type: boolean }
                  message: { type: string }
        "409": { $ref: "#/components/responses/Error" }
  /tuners:
    get:
      tags: [live]
      operationId: listTuners
      description: Live tuner status, including tuners held by other devices.
      responses:
        "200":
          description: Tuners
          content:
            application/json:
              schema:
                type: object
                required: [tuners]
                properties:
                  tuners:
                    type: array
                    items: { $ref: "#/components/schemas/Tuner" }
                  encoder: { type: string }
  /recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      responses:
        "200":
          description: Recordings, newest first
          content:
            application/json:
              schema:
                type: object
                required: [recordings]
                properties:
                  recordings:
                    type: array
                    items: { $ref: "#/components/schemas/Recording" }
    post:
      tags: [recordings]
      operationId: startRecording
      description: Record a channel now. When the guide has the current airing, the recording runs to its end plus padding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { type: integer, format: int64 }
                minutes: { type: integer }
                title: { type: string }
      responses:
        "200":
          description: Recording started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recording" }
        "409": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /recordings/{id}:
    delete:
      tags: [recordings]
      operationId: deleteRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/stop:
    post:
      tags: [recordings]
      operationId: stopRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /recordings/{id}/play:
    post:
      tags: [recordings]
      operationId: playRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
      responses:
        "200":
          description: Playback for a finished or in-progress recording
          content:
            application/json:
              schema:
                type: object
                required: [playlist, position, growing, markers]
                properties:
                  playlist: { type: string }
                  position: { type: number, description: "Resume position in seconds" }
                  growing: { type: boolean, description: "True while the recording is still being written" }
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/progress:
    put:
      tags: [recordings]
      operationId: saveProgress
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: number }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  position: { type: number }
  /recordings/{id}/watched:
    put:
      tags: [recordings]
      operationId: setWatched
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watched]
              properties:
                watched: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /recordings/{id}/file:
    get:
      tags: [recordings]
      operationId: downloadRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The original broadcast
          content:
            video/mp2t:
              schema: { type: string, format: binary }
  /recordings/{id}/markers:
    get:
      tags: [recordings]
      operationId: listMarkers
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Commercial markers
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
    post:
      tags: [recordings]
      operationId: addMarker
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start: { type: number }
                end: { type: number }
      responses:
        "200":
          description: Marker added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marker" }
  /recordings/{id}/detect:
    post:
      tags: [recordings]
      operationId: detectBreaks
      description: Find commercial breaks (comskip when installed, otherwise black frames).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Markers after detection
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
  /markers/{id}:
    delete:
      tags: [recordings]
      operationId: deleteMarker
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /schedule:
    get:
      tags: [dvr]
      operationId: getSchedule
      description: Upcoming recordings from passes for the next 14 days, with conflicts marked.
      responses:
        "200":
          description: Planned recordings
          content:
            application/json:
              schema:
                type: object
                required: [tunerCount, items]
                properties:
                  tunerCount: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PlannedAiring" }
  /schedule/skip:
    post:
      tags: [dvr]
      operationId: skipAiring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                programId: { type: string }
                title: { type: string }
                subtitle: { type: string }
                channelId: { type: integer, format: int64 }
                start: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /passes:
    get:
      tags: [dvr]
      operationId: listPasses
      responses:
        "200":
          description: Passes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
    post:
      tags: [dvr]
      operationId: addPass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                channelId: { type: integer, format: int64, description: "0 records on any channel" }
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
  /passes/{id}:
    patch:
      tags: [dvr]
      operationId: updatePass
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pass" }
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
    delete:
      tags: [dvr]
      operationId: deletePass
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
  /teams:
    get:
      tags: [dvr]
      operationId: listTeams
      responses:
        "200":
          description: Teams this household follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
    put:
      tags: [dvr]
      operationId: followTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamFollow" }
      responses:
        "200":
          description: Teams after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
  /teams/{id}:
    delete:
      tags: [dvr]
      operationId: unfollowTeam
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Teams after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
  /events:
    get:
      tags: [server]
      operationId: listEvents
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
  /virtuals:
    get:
      tags: [virtuals]
      operationId: listVirtuals
      responses:
        "200":
          description: Library channels
          content:
            application/json:
              schema:
                type: object
                required: [virtuals]
                properties:
                  virtuals:
                    type: array
                    items: { $ref: "#/components/schemas/VirtualChannel" }
    post:
      tags: [virtuals]
      operationId: createVirtual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                number: { type: string }
                name: { type: string }
                recordings:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualChannel" }
  /virtuals/{id}:
    patch:
      tags: [virtuals]
      operationId: updateVirtual
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderMode: { type: string, enum: [custom, release, random, season, show, marathon] }
                ruleTitle: { type: string }
                recordings:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualChannel" }
  /virtuals/schedule:
    get:
      tags: [virtuals]
      operationId: virtualSchedule
      responses:
        "200":
          description: Library channel slots for the next 48 hours
          content:
            application/json:
              schema:
                type: object
                required: [virtuals]
                properties:
                  virtuals:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/VirtualChannel"
                        - type: object
                          properties:
                            slots:
                              type: array
                              items: { $ref: "#/components/schemas/Slot" }
  /virtuals/{id}/play:
    post:
      tags: [virtuals]
      operationId: playVirtual
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                index: { type: integer }
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
      responses:
        "200":
          description: Playback for one recording on the channel. Uses no tuner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usesTuner: { type: boolean }
                  index: { type: integer }
                  count: { type: integer }
                  playlist: { type: string }
                  number: { type: string }
                  name: { type: string }
                  recording: { $ref: "#/components/schemas/Recording" }
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        "200":
          description: Settings with defaults filled in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      tags: [settings]
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
  /setup/finish:
    post:
      tags: [settings]
      operationId: startSetupFinish
      description: |
        After a tuner is in the lineup, finish setup on the server.
        Scan when the lineup is empty, load listings, check the recordings folder,
        star ABC, CBS, FOX, and NBC, time the encoder, and summarize the antenna.
        Poll GET until running is false. The ready line is the summary.
      responses:
        "200":
          description: Setup progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupFinish" }
    get:
      tags: [settings]
      operationId: setupFinishStatus
      description: Progress for the setup that is finishing itself.
      responses:
        "200":
          description: Setup progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupFinish" }
  /storage:
    get:
      tags: [settings]
      operationId: getStorage
      responses:
        "200":
          description: Recordings disk
          content:
            application/json:
              schema:
                type: object
                properties:
                  freeBytes: { type: integer, format: int64 }
                  totalBytes: { type: integer, format: int64 }
                  watermarkGB: { type: integer }
  /backup:
    get:
      tags: [settings]
      operationId: downloadBackup
      responses:
        "200":
          description: Catalog database (channels edits, passes, markers, settings). Video files are not included.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    post:
      tags: [settings]
      operationId: restoreBackup
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /support:
    get:
      tags: [settings]
      operationId: downloadSupport
      description: Zip of recent logs, versions, doctor results, and redacted settings. Passwords and tuner DeviceAuth are left out.
      responses:
        "200":
          description: Support bundle
          content:
            application/zip:
              schema: { type: string, format: binary }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: true
      properties:
        code:
          type: string
          description: Stable machine code, for example tuners_busy, disk_low, not_found, bad_request.
        message: { type: string, description: Short text safe to show a user. }
        tuners:
          type: array
          items: { $ref: "#/components/schemas/Tuner" }
        freeBytes: { type: integer, format: int64 }
        needBytes: { type: integer, format: int64 }
    RoomState:
      type: object
      required: [room, mode, anchorServer, anchorMedia, rate, latency, version, members]
      properties:
        room: { type: string }
        channelId: { type: integer, format: int64 }
        mode: { type: string, enum: [follow, group] }
        anchorServer: { type: number, description: "Server Unix ms when the anchor was set" }
        anchorMedia: { type: number, description: "Program date-time (Unix ms) playing at anchorServer" }
        rate: { type: number, enum: [0, 1] }
        latency: { type: string, enum: [lowest, balanced, stable] }
        version: { type: integer }
        members: { type: integer }
    ServerInfo:
      type: object
      required: [id, name, version, apiVersion, features]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        apiVersion: { type: integer }
        encoder: { type: string }
        tunerCount: { type: integer }
        features:
          type: array
          items: { type: string }
        update:
          $ref: "#/components/schemas/ServerUpdate"
          description: "Present when a newer release is available. Omitted when this build is current or the check is off."
    ServerUpdate:
      type: object
      required: [version, notesUrl, message]
      description: "A newer Broadwave release. The message is the banner."
      properties:
        version: { type: string, description: "Release tag without a leading v." }
        notesUrl: { type: string, description: "Release notes page." }
        message: { type: string, description: "Banner text, for example Broadwave 0.7 is available." }
    Device:
      type: object
      required: [deviceId, friendlyName, baseUrl, tunerCount]
      properties:
        deviceId: { type: string }
        friendlyName: { type: string }
        modelNumber: { type: string }
        firmwareName: { type: string }
        firmwareVersion: { type: string }
        upgradeAvailable: { type: string }
        baseUrl: { type: string }
        lineupUrl: { type: string }
        tunerCount: { type: integer }
        priority: { type: integer }
        lastSeen: { type: string }
        note: { type: string }
    DeviceHealth:
      type: object
      required: [deviceId, model, firmwareVersion, tuners]
      description: Live model, firmware version, and signal lock. Empty error means the tuner answered.
      properties:
        deviceId: { type: string }
        model: { type: string }
        firmwareVersion: { type: string }
        tuners:
          type: array
          items: { $ref: "#/components/schemas/TunerLock" }
        error: { type: string, description: "Set when the tuner did not answer." }
    TunerLock:
      type: object
      required: [index, locked]
      description: Signal lock for one tuner. Locked is false when the device reports no lock.
      properties:
        index: { type: integer }
        locked: { type: boolean }
    Source:
      type: object
      required: [id, kind, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [hdhomerun, hdhr-compatible, m3u, xtream, tvheadend, channels-dvr, link, folder] }
        name: { type: string }
        url: { type: string }
        xmltvUrl: { type: string }
        enabled: { type: boolean }
        stableKey: { type: string }
        priority: { type: integer }
        tunerCount: { type: integer }
        streamLimit: { type: integer }
        streamFormat: { type: string, description: "ts or hls. Empty until the source is probed." }
        hasGuide: { type: boolean }
        needsTuner: { type: boolean }
        refresh: { type: string, description: "When this source will be fetched again." }
        lastRefresh: { type: string }
        health: { type: string, description: "Empty when the source is online. Otherwise the last error." }
        streamsInUse: { type: integer }
        deviceId: { type: string }
    Channel:
      type: object
      required: [id, deviceId, guideNumber, guideName, displayNumber, displayName, hd, favorite, enabled, hidden, present]
      properties:
        id: { type: integer, format: int64 }
        deviceId: { type: string }
        guideNumber: { type: string }
        guideName: { type: string }
        displayNumber: { type: string }
        displayName: { type: string }
        videoCodec: { type: string }
        audioCodec: { type: string }
        hd: { type: boolean }
        favorite: { type: boolean }
        enabled: { type: boolean }
        hidden: { type: boolean }
        present: { type: boolean }
        guideKey: { type: string, description: "XMLTV channel id or call sign to use for this channel. Blank uses the number and call sign." }
        artUrl: { type: string, description: "Channel logo from the guide. Empty when the source has none." }
        artWidth: { type: integer, description: "Native logo width in pixels. Omitted until the picture has been measured." }
        artHeight: { type: integer, description: "Native logo height in pixels. Omitted until the picture has been measured." }
        network: { type: string, description: "ABC, CBS, FOX, or NBC when the server can tell. Empty otherwise." }
    ChannelPatch:
      type: object
      properties:
        favorite: { type: boolean }
        enabled: { type: boolean }
        hidden: { type: boolean }
        customName: { type: string }
        customNumber: { type: string }
        guideKey: { type: string }
    Airing:
      type: object
      required: [id, channelId, title, start, end]
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        category: { type: string }
        programId: { type: string }
        new: { type: boolean }
        imageUrl: { type: string, description: "Program artwork from the guide. Empty when the source has none." }
        imageWidth: { type: integer, description: "Native artwork width in pixels. Omitted until the picture has been measured." }
        imageHeight: { type: integer, description: "Native artwork height in pixels. Omitted until the picture has been measured." }
        season: { type: integer, description: "1-based season. Omitted when the guide does not say." }
        episode: { type: integer, description: "1-based episode. Omitted when the guide does not say." }
        episodeLabel: { type: string }
        originalAir: { type: string, description: "YYYY-MM-DD or a year." }
        seriesId: { type: string }
        live: { type: boolean }
        premiere: { type: boolean }
        finale: { type: boolean }
        rating: { type: string }
        cast: { type: string }
        gameId: { type: string, description: "Scoreboard game this listing is. Empty when it is not a matched game." }
        guideSource: { type: string, description: "Where this listing came from: silicondust, schedules-direct, xmltv, playlist, or broadcast." }
        guideNumber: { type: string }
        channelName: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    Game:
      type: object
      required: [id, league, name, start, state]
      properties:
        id: { type: string }
        league: { type: string }
        name: { type: string }
        shortName: { type: string }
        start: { type: string, format: date-time }
        state: { type: string, description: "pre, in, or post" }
        completed: { type: boolean }
        detail: { type: string }
        clock: { type: string }
        period: { type: integer }
        broadcasts:
          type: array
          items: { type: string }
        teams:
          type: array
          items: { $ref: "#/components/schemas/SportsTeam" }
    SportsTeam:
      type: object
      required: [name]
      properties:
        name: { type: string }
        short: { type: string }
        abbr: { type: string }
        score: { type: string }
        home: { type: boolean }
        color: { type: string }
        altColor: { type: string }
        logo: { type: string }
    SearchAiring:
      allOf:
        - $ref: "#/components/schemas/Airing"
        - type: object
          required: [guideNumber, channelName]
          properties:
            guideNumber: { type: string }
            channelName: { type: string }
    PictureMode:
      type: string
      enum: [broadcast, smooth, film]
      description: broadcast rebuilds interlaced video at 60 frames a second; smooth uses motion-compensated deinterlacing; film recovers 24p.
    Tuner:
      type: object
      required: [index, ours]
      properties:
        index: { type: integer }
        guide: { type: string }
        name: { type: string }
        target: { type: string }
        ours: { type: boolean }
        strength: { type: integer }
        quality: { type: integer }
        symbol: { type: integer }
        viewers: { type: integer }
    ChannelSignal:
      type: object
      required: [channelId, number, name]
      properties:
        channelId: { type: integer, format: int64 }
        number: { type: string }
        name: { type: string }
        frequencyHz: { type: integer }
        strength: { type: integer }
        quality: { type: integer }
        symbol: { type: integer }
        verdict: { type: string, enum: [Great, OK, Weak, Lost] }
        tip: { type: string }
        live: { type: boolean }
        checkedAt: { type: string, format: date-time }
    Caps:
      type: object
      description: What the client can decode and display.
      required: [platform, video, audio]
      properties:
        platform: { type: string, enum: [tvos, ios, ipados, macos, visionos, web] }
        video:
          type: array
          items: { type: string, enum: [h264, hevc, mpeg2] }
        audio:
          type: array
          items: { type: string, enum: [aac, ac3, eac3] }
        maxHeight: { type: integer }
        network: { type: string, enum: [lan, wifi, cellular, remote] }
    Prefs:
      type: object
      description: The viewer's choices. Empty means automatic.
      properties:
        quality: { type: string, enum: [auto, original, high, medium, saver, tile, "360"] }
        audio: { type: string, enum: [auto, surround, stereo, none] }
        picture: { $ref: "#/components/schemas/PictureMode" }
        track: { type: string, enum: [main, language, described], description: "Which broadcast audio mix to play. Empty is main." }
        even: { type: boolean, description: "Level the volume. Off keeps the original mix." }
    MultiviewPlan:
      type: object
      required: [playable, blocked, tunersNeeded, tunersFree]
      properties:
        playable:
          type: array
          items:
            type: object
            required: [channelId, frequencyHz, shared]
            properties:
              channelId: { type: integer, format: int64 }
              frequencyHz: { type: integer }
              shared: { type: boolean, description: "True when this channel shares a tuner with another tile." }
        blocked:
          type: array
          items:
            type: object
            required: [channelId, reason, holders]
            properties:
              channelId: { type: integer, format: int64 }
              reason: { type: string }
              holders:
                type: array
                items: { type: string }
        tunersNeeded: { type: integer }
        tunersFree: { type: integer }
        note: { type: string }
    StreamInfo:
      type: object
      required: [rendition, video, audio, reason]
      properties:
        rendition: { type: string }
        video: { type: string, enum: [copy, "1080", "720", "540", "360"] }
        audio: { type: string, enum: [copy, aac2, aac6, none] }
        mode: { $ref: "#/components/schemas/PictureMode" }
        reason: { type: string, description: "Short, user-facing explanation of the choice" }
        sourceVideo: { type: string }
        sourceAudio: { type: string }
        encoder: { type: string }
        scan: { type: string, description: "progressive, interlaced, or film" }
        sourceWidth: { type: integer }
        sourceHeight: { type: integer }
        sourceFps: { type: string, description: "Broadcast frame rate, such as 59.94" }
        outputWidth: { type: integer }
        outputHeight: { type: integer }
        outputFps: { type: string }
        bitrate: { type: string, description: "Encoder target, such as 14M" }
        decode: { type: string, description: "gpu or cpu when this rendition is transcoded" }
    WatchSession:
      type: object
      required: [channelId, playlist, rendition, stream, encoder, shared, viewers]
      properties:
        channelId: { type: integer, format: int64 }
        playlist:
          type: string
          description: |
            HLS playlist path, relative to the server origin. Every segment carries
            EXT-X-PROGRAM-DATE-TIME on the channel's shared timeline, identical across renditions.
        rendition: { type: string }
        stream: { $ref: "#/components/schemas/StreamInfo" }
        profile: { type: string }
        audio: { type: string }
        encoder: { type: string }
        picture: { $ref: "#/components/schemas/PictureMode" }
        videoMode: { type: string }
        shared: { type: boolean }
        viewers: { type: integer }
        frequencyHz: { type: integer }
        program: { type: integer }
        hints:
          type: array
          items: { type: string }
        tuners:
          type: array
          items: { $ref: "#/components/schemas/Tuner" }
    Recording:
      type: object
      required: [id, channelId, guideNumber, title, status, startedAt]
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        guideNumber: { type: string }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        category: { type: string }
        programId: { type: string }
        gameId: { type: string, description: "Scoreboard game this recording is following. Empty when it is not a matched game." }
        status: { type: string, enum: [recording, complete, failed, stopped, imported] }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        bytes: { type: integer, format: int64 }
        position: { type: number }
        durationSec: { type: number }
        watched: { type: integer }
    Marker:
      type: object
      required: [id, start, end]
      properties:
        id: { type: integer, format: int64 }
        recordingId: { type: integer, format: int64 }
        start: { type: number }
        end: { type: number }
    Pass:
      type: object
      required: [id, title]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        channelId: { type: integer, format: int64 }
        kind: { type: string }
        padBefore: { type: integer, minimum: 0, maximum: 30 }
        padAfter: { type: integer, minimum: 0, maximum: 30 }
        priority: { type: integer }
        episodes: { type: string, enum: [all, new] }
        keepMode: { type: string, enum: [all, latest] }
        keepCount: { type: integer }
        limitCount: { type: integer }
        rerecord: { type: boolean }
        commercials: { type: boolean }
        timeStart: { type: string, description: "HH:MM local" }
        timeEnd: { type: string, description: "HH:MM local" }
        matchKind: { type: string, enum: [title, contains, category, team] }
    TeamFollow:
      type: object
      required: [name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        short: { type: string }
        abbr: { type: string }
        league: { type: string }
        logo: { type: string }
        color: { type: string }
        record: { type: boolean, description: "Record every game for this team." }
    TeamList:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamFollow" }
    PassList:
      type: object
      required: [passes]
      properties:
        passes:
          type: array
          items: { $ref: "#/components/schemas/Pass" }
    PlannedAiring:
      type: object
      required: [passId, airing, priority, padBefore, padAfter, conflict, skipped]
      properties:
        passId: { type: integer, format: int64 }
        airing: { $ref: "#/components/schemas/Airing" }
        priority: { type: integer }
        padBefore: { type: integer }
        padAfter: { type: integer }
        conflict: { type: boolean }
        skipped: { type: boolean }
        reason: { type: string }
    Event:
      type: object
      required: [id, at, kind, message]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string }
    VirtualChannel:
      type: object
      required: [id, number, name, recordings]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        name: { type: string }
        orderMode: { type: string }
        ruleTitle: { type: string }
        recordings:
          type: array
          items: { type: integer, format: int64 }
    Slot:
      type: object
      required: [recordingId, title, start, end]
      properties:
        recordingId: { type: integer, format: int64 }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    SetupStep:
      type: object
      required: [id, title, state]
      properties:
        id: { type: string }
        title: { type: string }
        state: { type: string, enum: [waiting, running, done, skipped] }
        detail: { type: string }
    SetupFinish:
      type: object
      required: [running, steps]
      properties:
        running: { type: boolean }
        ready: { type: string, description: "Summary once setup has finished, such as Ready: 27 channels, guide for 21, 2 tuners, Intel GPU." }
        channelId: { type: integer, format: int64, description: "First channel to watch. A favorite when one was starred." }
        steps:
          type: array
          items: { $ref: "#/components/schemas/SetupStep" }
    Settings:
      type: object
      properties:
        layout: { type: string, enum: [auto, desktop, tv, phone] }
        recordingsPath: { type: string }
        profile: { type: string, enum: [transparent, balanced, saver] }
        audio: { type: string, enum: [stereo, surround] }
        encoder: { type: string }
        watermarkGB: { type: string, description: "Free-space reserve in GB; 0 turns it off" }
        pictureMode: { $ref: "#/components/schemas/PictureMode" }
        autoplay: { type: string, enum: ["0", "1"] }
        hdhrEmulate: { type: string, enum: ["0", "1"] }
        setupComplete: { type: string, enum: ["0", "1"] }
        needsSetup: { type: string, enum: ["0", "1"], description: "1 when this catalog should show the setup wizard. Set by the server; ignored on write." }
        lastGuidePull: { type: string, format: date-time, description: "When listings last loaded. Set by the server." }
        nextGuidePull: { type: string, format: date-time, description: "When the next automatic listing refresh is due. Set by the server." }
        lastManualGuidePull: { type: string, format: date-time, description: "When listings were last reloaded by hand. Set by the server." }
        hideScores: { type: string, enum: ["0", "1"] }
        liveScores: { type: string, enum: ["0", "1"], description: "1 asks the scoreboard. 0 stops every scoreboard request. Missing means on." }
        checkUpdates: { type: string, enum: ["0", "1"], description: "1 checks for a newer release once a day. 0 turns the check off. Missing means on." }
        sdUser: { type: string }
        sdPassword: { type: string }
        sdLineup: { type: string }
        sdPasswordSet: { type: string, enum: ["0", "1"] }
        guideUrl: { type: string }
        tmdbKey: { type: string }
        tmdbKeySet: { type: string, enum: ["0", "1"] }
        sportsdbKey: { type: string, description: "The user's TheSportsDB key. Never returned. Empty clears it." }
        sportsdbKeySet: { type: string, enum: ["0", "1"], description: "1 when a TheSportsDB key is saved. Set by the server." }
