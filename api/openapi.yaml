openapi: 3.1.0
info:
  title: Broadwave
  version: 1.0.0
  description: |
    Live TV and DVR server for HDHomeRun tuners. This document is the contract for the
    web app and the iOS and tvOS apps; generated clients come from it.

    Every route is served under `/api/v1`. The same routes are also mounted under `/api`.
    The web app and the Apple apps call `/api/v1`.

    Errors use one envelope: `{"code": "tuners_busy", "message": "...", ...details}`.
    Tuner stream URLs and tuner DeviceAuth are never returned.
servers:
  - url: http://localhost:8477/api/v1
tags:
  - name: server
  - name: sources
  - name: channels
  - name: guide
  - name: live
  - name: recordings
  - name: dvr
  - name: virtuals
  - name: settings
  - name: pairing
paths:
  /health:
    get:
      tags: [server]
      operationId: health
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
  /server:
    get:
      tags: [server]
      operationId: getServer
      description: Identity and capabilities. Clients use `id` to recognize a paired server at a new address. `features` lists what this build can do. `minAppVersion` is the oldest app that should talk to it. An older app is still served.
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
    patch:
      tags: [server]
      operationId: renameServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  description: Counted in characters. A name that is only spaces is 400.
      responses:
        "200":
          description: Updated server info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "400": { $ref: "#/components/responses/Error" }
  /clock:
    get:
      tags: [server]
      operationId: getClock
      description: Server time for a first clock-offset estimate. The socket's clock messages refine it.
      responses:
        "200":
          description: Server time
          content:
            application/json:
              schema:
                type: object
                required: [serverTime]
                properties:
                  serverTime: { type: number, description: "Unix milliseconds" }
  /groups:
    get:
      tags: [server]
      operationId: listGroups
      description: Watch-together groups on this server and who is in each. A group ends when its last screen leaves.
      responses:
        "200":
          description: Every group room
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/RoomState" }
  /screens:
    get:
      tags: [server]
      operationId: listScreens
      description: The apps open on this server right now that another screen can send a channel to. Each app names itself with `here` on the socket; apps that send no `id` are left out.
      responses:
        "200":
          description: Every open screen
          content:
            application/json:
              schema:
                type: object
                required: [screens]
                properties:
                  screens:
                    type: array
                    items: { $ref: "#/components/schemas/Screen" }
  /screens/{id}/watch:
    post:
      tags: [server]
      operationId: sendToScreen
      description: Tells one screen to play a channel live (a `screen.watch` event on its socket). It joins the channel's room like any screen, so it lands on the same moment as the others.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { type: integer, format: int64 }
                from: { type: string, description: "The sending screen's name, shown on the receiving screen" }
      responses:
        "202": { description: Sent }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /screens/{id}/remote:
    post:
      tags: [server]
      operationId: pressRemote
      description: Presses one remote button on a screen (a `screen.remote` event on its socket), as a watch or a phone working a TV does. The screen acts as its own player would. `up` and `down` change channel like the arrow keys, `pause` and `play` act as its viewer pausing, and `record` starts or stops the program it plays. A screen that plays nothing ignores it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [up, down, pause, play, record] }
                from: { type: string, description: "The remote's name" }
      responses:
        "202": { description: Sent }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /ws:
    get:
      tags: [server]
      operationId: openSocket
      description: |
        WebSocket for live updates and Whole-Home Sync. Every frame is `{"type", "data"}`.

        Server to client: `hello` {serverTime, boot, versions} (boot names the server process; a new one means it restarted and every watch and room is gone; versions are the data counters {guide, channels, recordings, schedule, settings}, so a reconnecting app refetches only what moved), `clock` {t0, t1}, `activity` (Event),
        `live.changed` (refetch tuners and sessions), `guide.changed`, `channels.changed`, `recordings.changed`, `schedule.changed`, `settings.changed` {version} (that data changed; refetch it; a burst of writes is one event), `sources.found` {found} (discovery found a different set of tuners or lineups; not sent when nothing changed), `sync.state` (RoomState), `groups.changed` (someone joined or left a group; refetch `/groups`), `game.alert` (GameAlert: a followed team's game starting or a close finish, on a channel this home gets; at most once per game and kind), `screen.watch` {channelId, from} (another screen sent this one a channel; see `/screens`), `screen.remote` {action, from} (a remote pressed a button for this screen; see `/screens/{id}/remote`), `client.revoked` {id} (a paired device was revoked; the device with that id is signed out and should show the sign-in screen), `remote.changed` (Away from home changed; an admin reads `/remote` and `/remote/cloudflare` again), `error` {code, message}.

        Client to server: `here` {id, name, kind, channelId} (names this screen; `id` is the app's own stable id, 1-64 letters, digits, or `-`; kind is iphone, ipad, appletv, or web; `channelId` is the channel it plays alone, sent again on each change, so a screen with sync off still shows what it watches in `/screens`), `clock` {t0}, `sync.join` {room, channelId, latency}, `sync.leave` {room},
        `sync.command` {room, action: play|pause|seek|live|latency|stalled, mediaTime, latency}. `stalled` steps a one-screen room or a multiview 2 s further from live, never past its latency target.
        A join's `latency` (lowest|balanced|stable, the screen's default) applies only when the join starts the room. A room with an Apple screen in it plays at balanced or further back: AVPlayer never reaches lowest.

        Rooms are `channel:<id>` (everyone on a channel, following live) or `group:<code>`
        (watch together: shared controls, and `people` names who is in it). A code is 1-32
        letters, digits, `-`, or `_`; a join with any other code is ignored. At server time T a room shows media time
        `anchorMedia + (T - anchorServer) * rate`, where media time is the segment
        program date-time (Unix ms). See docs/decisions/0003-whole-home-sync.md.
      responses:
        "101":
          description: Switching to WebSocket
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /diagnostics:
    get:
      tags: [server]
      operationId: getDiagnostics
      description: Tuners and signal, encoder and ffmpeg (`encoder.ac4` is false when ffmpeg cannot decode ATSC 3.0 sound), the startup picture benchmark (class, speed, transcode height, the large tile, and how many tiles fit), storage, guide freshness, what the relay is carrying, the last ten channel starts (`starts`, seconds from the watch to the first segment split into tune, keyframe, encoder, and segment, newest first), feed counts, recent logs, connected apps, and recent activity.
      responses:
        "200":
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /metrics:
    get:
      tags: [server]
      operationId: getMetrics
      description: Prometheus text for tuned channels, viewers, and ffmpeg processes. Passwords and tuner DeviceAuth are left out.
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema: { type: string }
  /runtime:
    get:
      tags: [server]
      operationId: getRuntime
      description: |
        Process counters for a long run or a support note. `goroutines` is how many are alive.
        `heapAlloc`, `heapInuse`, `heapSys`, and `sys` are Go memory bytes. `numGC` is completed collections.
        `maxRss` is the resident-set high water in bytes, or 0 when the OS does not report it.
        `openFDs` is how many files this process has open, or -1 when they cannot be listed.
        `uptimeSec` is seconds since the process started.
        Pass `gc=1` to collect garbage first, so a reading after the viewers leave is not inflated by memory Go can already free.
      parameters:
        - name: gc
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Process counters
          content:
            application/json:
              schema:
                type: object
                required: [goroutines, heapAlloc, heapInuse, heapSys, sys, numGC, maxRss, openFDs, uptimeSec]
                properties:
                  goroutines: { type: integer, minimum: 0 }
                  heapAlloc: { type: integer, minimum: 0 }
                  heapInuse: { type: integer, minimum: 0 }
                  heapSys: { type: integer, minimum: 0 }
                  sys: { type: integer, minimum: 0 }
                  numGC: { type: integer, minimum: 0 }
                  maxRss: { type: integer, minimum: 0 }
                  openFDs: { type: integer }
                  uptimeSec: { type: integer, minimum: 0 }
  /profile:
    get:
      tags: [server]
      operationId: getProfile
      responses:
        "200":
          description: The household profile
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
                  auth: { type: string }
                  note: { type: string, description: "With sign-in off, a password is required before this server is opened beyond the home network. With sign-in on, devices sign in with a pairing code." }
  /devices:
    get:
      tags: [sources]
      operationId: listDevices
      responses:
        "200":
          description: Tuner and source devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
  /devices/{id}:
    delete:
      tags: [sources]
      operationId: removeDevice
      description: Forget a tuner or playlist and its channels. A channel another device also carries keeps its favorite, custom name and number, and passes there; the other passes are deleted. Recordings stay. A tuner that answers a later search for tuners comes back.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The devices that are left
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    patch:
      tags: [sources]
      operationId: patchDevice
      description: Retire a tuner taken away on purpose, or bring it back. Its channels, passes, and recordings stay; it counts toward no recording plan and raises no "stopped answering" note. A retired tuner that answers discovery again is no longer retired.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retired]
              properties:
                retired: { type: boolean }
      responses:
        "200":
          description: The devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/health:
    get:
      tags: [sources]
      operationId: getDeviceHealth
      description: Model, firmware version, and signal lock for each tuner. Read only. This server does not install firmware.
      responses:
        "200":
          description: Tuner health
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceHealth" }
  /devices/{id}/scan:
    post:
      tags: [sources]
      operationId: startChannelScan
      description: Ask one tuner to scan for channels. This uses a tuner until the scan finishes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan started
          content:
            application/json:
              schema:
                type: object
                required: [scanning]
                properties:
                  scanning: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [sources]
      operationId: channelScanStatus
      description: How far the channel scan has gotten.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan progress
          content:
            application/json:
              schema:
                type: object
                required: [scanning, found]
                properties:
                  scanning: { type: boolean }
                  found: { type: integer, description: "Channels found so far." }
                  progress: { type: integer, description: "Percent done, when the tuner reports it." }
        "404": { $ref: "#/components/responses/Error" }
  /home:
    get:
      tags: [sources]
      operationId: listHome
      description: Tuners, screens, and servers on this network. Nothing is added.
      parameters:
        - in: query
          name: fresh
          schema: { type: string, enum: ["1"] }
          description: When 1, scan again instead of using the last few seconds.
      responses:
        "200":
          description: What this scan found, with one action each
          content:
            application/json:
              schema:
                type: object
                required: [places, tunerAddress, sharing]
                properties:
                  places:
                    type: array
                    items:
                      type: object
                      required: [id, group, kind, name, action]
                      properties:
                        id: { type: string }
                        group: { type: string, enum: [tuner, screen, server] }
                        kind: { type: string }
                        name: { type: string }
                        addr: { type: string }
                        action: { type: string, enum: [add, added, use, here, found] }
                        detail: { type: string }
                  tunerAddress: { type: string, description: "Host and port other apps add as an HDHomeRun." }
                  sharing: { type: boolean, description: "True when this server is acting as an HDHomeRun." }
  /sources/discover:
    post:
      tags: [sources]
      operationId: discoverSources
      description: Find HDHomeRun tuners by broadcast, or read one address. Reads the lineup only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ip: { type: string, description: "Host or host:port. Empty broadcasts." }
      responses:
        "200":
          description: Devices after the refresh
          content:
            application/json:
              schema:
                type: object
                required: [devices, found]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  found: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /sources/look:
    post:
      tags: [sources]
      operationId: lookHarder
      description: Probe this network for tuners and servers. Does not open a tuner stream.
      responses:
        "200":
          description: Devices and servers that answered
          content:
            application/json:
              schema:
                type: object
                required: [found]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [kind, name, addr]
                      properties:
                        kind: { type: string }
                        name: { type: string }
                        addr: { type: string }
                        id: { type: string }
        "500": { $ref: "#/components/responses/Error" }
  /sources/free:
    get:
      tags: [sources]
      operationId: findFreeChannels
      description: Look for FastChannels, Pluto, and Samsung generators already on this network.
      responses:
        "200":
          description: Feeds that answered, or a short guide when none did
          content:
            application/json:
              schema:
                type: object
                required: [found, guide]
                properties:
                  found:
                    type: array
                    items:
                      type: object
                      required: [kind, name, addr, playlist, guide]
                      properties:
                        kind: { type: string }
                        name: { type: string }
                        addr: { type: string }
                        playlist: { type: string }
                        guide: { type: string }
                  guide: { type: string }
    post:
      tags: [sources]
      operationId: addFreeChannels
      description: |
        Add one generator feed as a tuner-free playlist. DRM streams are skipped.
        With a playlist, kind is ignored. Without one, kind is fastchannels, pluto, or samsung (any case) on addr; anything else is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                addr: { type: string }
                playlist: { type: string }
                guide: { type: string }
                name: { type: string }
      responses:
        "200":
          description: The source, plus a note when DRM channels were skipped
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, kind, name, url, xmltvUrl, message]
                properties:
                  id: { type: integer, format: int64 }
                  kind: { type: string, enum: [free] }
                  name: { type: string }
                  url: { type: string }
                  xmltvUrl: { type: string }
                  message: { type: string, description: "Empty when every channel was added. Otherwise how many DRM channels were skipped." }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /sources:
    get:
      tags: [sources]
      operationId: listSources
      responses:
        "200":
          description: M3U, stream link, and folder sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
    post:
      tags: [sources]
      operationId: addSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [m3u, xtream, tvheadend, channels, threadfin, xteve, ersatztv, dispatcharr, link, folder]
                  description: Matched without regard to case, and surrounding spaces are ignored. M3U is m3u.
                name: { type: string }
                url: { type: string, description: "Playlist URL, Xtream server, stream URL, or folder path" }
                username: { type: string }
                password: { type: string }
                xmltvUrl: { type: string }
                groups: { type: string, description: "Comma-separated group names. Prefix one with - to leave it out." }
                keep: { type: string, description: "Comma-separated channel names or tvg-ids to keep from a large playlist." }
                start: { type: integer, description: "First channel number. 0 keeps the numbers in the playlist." }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                name: { type: string }
                groups: { type: string }
                keep: { type: string }
                xmltvUrl: { type: string }
                file: { type: string, format: binary, description: "An M3U playlist. Gzip is unpacked." }
      responses:
        "200":
          description: |
            What was added, or a question before a long playlist is saved.
            A playlist, Xtream server, link, or emulator comes back as the source itself.
            A folder comes back as `source` and how many recordings were found.
            A playlist of more than 300 channels comes back as a pick, and nothing is saved until the next call names `groups` or `keep`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Source"
                  - type: object
                    additionalProperties: false
                    required: [source, added]
                    properties:
                      source: { $ref: "#/components/schemas/Source" }
                      added: { type: integer, description: "Recordings found in the folder." }
                  - $ref: "#/components/schemas/PlaylistPick"
        "400": { $ref: "#/components/responses/Error" }
  /channels:
    get:
      tags: [channels]
      operationId: listChannels
      parameters:
        - in: query
          name: guide
          schema: { type: string, enum: ["1"] }
          description: When 1, only channels that belong on the guide (present, enabled, not hidden).
      responses:
        "200":
          description: Lineup
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "304":
          description: Not modified. No body. If-None-Match matched the ETag.
  /channels/star:
    post:
      tags: [channels]
      operationId: starNetworkFavorites
      description: Favorite ABC, CBS, FOX, and NBC. The server picks the network from the guide, then from its call-sign table.
      responses:
        "200":
          description: Channels it marked favorite
          content:
            application/json:
              schema:
                type: object
                required: [starred]
                properties:
                  starred:
                    type: array
                    items:
                      type: object
                      required: [id, network]
                      properties:
                        id: { type: integer, format: int64 }
                        guideName: { type: string }
                        displayNumber: { type: string }
                        network: { type: string }
  /affiliations:
    get:
      tags: [channels]
      operationId: listAffiliations
      description: Call sign to network. The value is ABC, CBS, FOX, or NBC.
      responses:
        "200":
          description: The call-sign table
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                properties:
                  calls:
                    type: object
                    additionalProperties: { type: string }
  /channels/{id}:
    patch:
      tags: [channels]
      operationId: patchChannel
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelPatch" }
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /frames:
    get:
      tags: [channels]
      operationId: listFrames
      summary: Channels that already have a fresh preview, and channels with no signal.
      description: |
        A channel is listed when its preview JPEG exists and is newer than 10 minutes.
        Nothing is tuned to make one. Cards ask for `/channels/{id}/frame` only for these ids.
        `noSignal` lists the channels a tune found off the air in the last 10 minutes.
      responses:
        "200":
          description: Channel ids with a preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrameList" }
  /channels/{id}/frame:
    get:
      tags: [channels]
      operationId: channelFrame
      summary: Latest preview from a mux that is already tuned.
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: query
          name: w
          schema: { type: string }
          description: Only the exact value 1280 returns the wide JPEG. Omitted, 480, and every other value return the 480 JPEG and are not an error.
      responses:
        "200":
          description: JPEG preview. X-Frame-Stale is 1 when the picture is older than 10 minutes.
          headers:
            Last-Modified: { schema: { type: string } }
            X-Frame-Stale: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: No preview yet. Watching is not started to make one. }
  /airings:
    get:
      tags: [guide]
      operationId: listAirings
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: Start of the window. Defaults to 30 minutes ago.
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: End of the window. Defaults to 48 hours ahead when hours is omitted.
        - in: query
          name: channels
          schema: { type: string }
          description: Comma-separated channel ids. Omit for every channel.
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 168, default: 48 }
          description: How far ahead to return listings when to is omitted. Kept for older clients. Outside 1 to 168 is 400. A valid to ignores hours.
        - in: query
          name: kind
          schema: { type: string, enum: [sports] }
          description: |
            Only listings of this kind. sports is the apps' rule: a sports word in the category, or in a
            title that names a matchup (vs, at, @). A server that predates it returns every kind.
        - in: query
          name: fields
          schema: { type: string, enum: [grid] }
          description: |
            grid leaves out what a guide grid does not draw: description, cast, rating, originalAir,
            seriesId, programId, and guideSource. A listing's details come from a full request for its
            channel and time. A server that predates it returns every field.
      responses:
        "200":
          description: Guide listings in the window
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [airings]
                properties:
                  airings:
                    type: array
                    items: { $ref: "#/components/schemas/Airing" }
        "304":
          description: Not modified. No body. If-None-Match matched the ETag.
        "400": { $ref: "#/components/responses/Error" }
  /now:
    get:
      tags: [guide]
      operationId: nowNext
      description: |
        What is on every guide channel: the listing on the air and the one after, in guide order, without
        reading a guide window. Listings carry the grid fields only (as `/airings?fields=grid`). The answer
        changes each minute and when the guide or channels change (`guide.changed`, `channels.changed`).
      responses:
        "200":
          description: Now and next per channel
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [at, channels]
                properties:
                  at: { type: string, format: date-time, description: "The minute the answer is for." }
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/NowChannel" }
        "304":
          description: Not modified. No body. If-None-Match matched the ETag.
  /guide/refresh:
    post:
      tags: [guide]
      operationId: refreshGuide
      responses:
        "200":
          description: Listings reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  airings: { type: integer }
        "429":
          description: Manual refresh is limited to once an hour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /search:
    get:
      tags: [guide]
      operationId: search
      description: |
        Listings that have not ended, on the channels the guide shows (one row per channel when
        two tuners carry it): shows whose title has the words first, then the rest, each on now
        first and then by start time; and matching recordings.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Words to match in titles, descriptions, cast, and recordings.
      responses:
        "200":
          description: Upcoming listings and recordings that match
          content:
            application/json:
              schema:
                type: object
                required: [query, airings, recordings]
                properties:
                  query: { type: string }
                  airings:
                    type: array
                    items: { $ref: "#/components/schemas/SearchAiring" }
                  recordings:
                    type: array
                    items: { $ref: "#/components/schemas/Recording" }
        "500": { $ref: "#/components/responses/Error" }
  /sports/scoreboard:
    get:
      tags: [guide]
      operationId: scoreboard
      parameters:
        - in: query
          name: league
          schema:
            type: string
            enum: ["", nfl, ncaaf, nba, wnba, ncaab, mlb, nhl, mls, nwsl, epl, f1, nascar]
          description: One of nfl, ncaaf, nba, wnba, ncaab, mlb, nhl, mls, nwsl, epl, f1, or nascar. Blank asks for every league. Anything else, including NFL, is 400.
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Calendar day. Blank is today on the server.
      responses:
        "200":
          description: Games for the day
          content:
            application/json:
              schema:
                type: object
                required: [games]
                properties:
                  games:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /watch:
    post:
      tags: [live]
      operationId: watchChannel
      description: |
        Start or join live playback. Everyone on the same frequency shares one tuner.
        Send `caps` (what this device can play) and optional `prefs`; the server picks a
        rendition and explains the choice in `stream.reason`. `rendition` forces a specific
        one. `profile`/`audio`/`pictureMode` are the older web fields and still work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { type: integer, format: int64 }
                caps: { $ref: "#/components/schemas/Caps" }
                prefs: { $ref: "#/components/schemas/Prefs" }
                rendition: { type: string, description: "Force a rendition key, for example copy.copy or 720.aac2.broadcast" }
                profile: { type: string, enum: [transparent, balanced, saver], deprecated: true }
                audio: { type: string, enum: [stereo, surround], deprecated: true }
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
                confirmLive: { type: boolean, description: "Set when the viewer chooses to watch even though that recording will be missed." }
                room: { type: string, description: "The sync room the player joins, for a player that starts on the room's frame. A new encode for a room that plays well behind live starts in the buffer at that frame, and the reply waits until the playlist holds it (a few seconds at most)." }
      responses:
        "200":
          description: Live session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchSession" }
        "400": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found`: the channel is not in the lineup. `no_source`: no enabled source carries the channel now."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`tuners_busy`, `pictures_full`, `recording_soon`, or `streams_full` (a playlist has every stream it allows open; `limit` is that number)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: "`internal`: the channel did not start for a reason the viewer cannot fix. The message is plain words; the server log has the detail."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`no_signal`: the tuner could not lock the channel and sent nothing. The tuner is already free. `stream_down`: the channel's source (for example a playlist URL) answered with an error or not at all. `tuner_refused`: the tuner answered the stream request with an error, such as another app holding it. `tuner_silent`: no tuner answered at all. `start_failed`: the picture wrote nothing to play before the wait ran out, or failed every restart; trying again usually works, and the server log says why."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /watch/{id}/stop:
    post:
      tags: [live]
      operationId: stopWatching
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rendition: { type: string, description: "The rendition this viewer joined; empty releases from the busiest" }
                boot:
                  type: string
                  description: |
                    The `boot` from the watch answer. A stop that names another server
                    process is ignored: that process and its viewers are gone.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /watch/{id}/warm:
    post:
      tags: [live]
      operationId: warmChannel
      description: |
        Start the picture a watch of this channel would play, before the viewer asks,
        so the channel change that follows is instant. Send the same `caps`, `prefs`,
        and `rendition` a watch would. It tunes only an ATSC 3.0 channel the player
        takes as broadcast, and only while another tuner that can carry it stays free.
        It never stops another picture to fit the budget, and counts no viewer; one
        warmed picture runs at a time and stops after about 20 s unless a watch joins it.
        `profile`/`audio`/`pictureMode` are the older web fields and still work.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                caps: { $ref: "#/components/schemas/Caps" }
                prefs: { $ref: "#/components/schemas/Prefs" }
                rendition: { type: string, description: "Force a rendition key, for example copy.copy or 720.aac2.broadcast" }
                profile: { type: string, enum: [transparent, balanced, saver], deprecated: true }
                audio: { type: string, enum: [stereo, surround], deprecated: true }
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
      responses:
        "200":
          description: Whether the picture is running. False when the frequency is not tuned or the picture budget is full.
          content:
            application/json:
              schema:
                type: object
                required: [warm]
                properties:
                  warm: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found`: the channel is not in the lineup."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /multiview/plan:
    post:
      tags: [live]
      operationId: planMultiview
      description: |
        Which of these channels can play together. Channels on one frequency share a tuner.
        A channel with no known frequency needs a tuner of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelIds]
              properties:
                channelIds:
                  type: array
                  items: { type: integer, format: int64 }
                picker:
                  type: boolean
                  description: Include a cost for every channel in the lineup.
      responses:
        "200":
          description: Tuner budget for the requested channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiviewPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /mosaic:
    post:
      tags: [live]
      operationId: watchMosaic
      description: |
        One stream of 2 to 4 channels side by side (2) or in a grid (3 or 4), on a
        1920x1080 picture at 59.94, with the first channel's sound. It is for screens
        that take one stream: AirPlay, older devices, and other apps. Each channel
        rides its channel's shared tune. A mosaic takes two pictures of the server's
        picture budget. The answer comes once the playlist has its first segment.
        Viewers of the same channels in the same order share one encode. Send
        `POST /mosaic/{key}/stop` when done; a mosaic nobody fetches stops on its own.
        The same stream is MPEG-TS at `GET /export/mosaic/{key}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelIds]
              properties:
                channelIds:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items: { type: integer, format: int64 }
                  description: Different channels, the sound channel first.
      responses:
        "200":
          description: The running mosaic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MosaicSession" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /mosaic/{key}/stop:
    post:
      tags: [live]
      operationId: stopMosaic
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: The `key` from the mosaic answer.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /signals:
    get:
      tags: [live]
      operationId: listSignals
      description: Last antenna reading for each channel, plus a live reading when that frequency is already tuned. A channel whose tune found no signal in the last 20 seconds reads live and Lost.
      responses:
        "200":
          description: Channel signals
          content:
            application/json:
              schema:
                type: object
                required: [channels, running]
                properties:
                  running: { type: boolean }
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelSignal" }
  /signals/check:
    post:
      tags: [live]
      operationId: checkSignals
      description: Tune each frequency on an idle tuner, read signal strength, and stop if someone starts watching.
      responses:
        "200":
          description: Check started
          content:
            application/json:
              schema:
                type: object
                required: [running]
                properties:
                  running: { type: boolean }
                  message: { type: string }
        "409": { $ref: "#/components/responses/Error" }
  /tuners:
    get:
      tags: [live]
      operationId: listTuners
      description: Live tuner status, including tuners held by other devices.
      responses:
        "200":
          description: Tuners
          content:
            application/json:
              schema:
                type: object
                required: [tuners]
                properties:
                  tuners:
                    type: array
                    items: { $ref: "#/components/schemas/Tuner" }
                  encoder: { type: string }
  /recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      responses:
        "200":
          description: Recordings, newest first
          content:
            application/json:
              schema:
                type: object
                required: [recordings]
                properties:
                  recordings:
                    type: array
                    items: { $ref: "#/components/schemas/Recording" }
    post:
      tags: [recordings]
      operationId: startRecording
      description: Record a channel now. When the guide has the current airing, the recording runs to its end plus padding, for a day at most.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { type: integer, format: int64 }
                minutes: { type: integer, description: "How long to record, in minutes. Blank or 0 records for an hour, or until the current listing ends when that is longer. A day at most." }
                title: { type: string }
      responses:
        "200":
          description: Recording started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recording" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: "`no_signal`, `stream_down`, `tuner_refused`, or `tuner_silent`: the tune for a recording that starts now failed. `unavailable`: the player is not configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /recordings/nfo:
    post:
      tags: [recordings]
      operationId: writeRecordingNfo
      description: Write or refresh the .nfo beside every finished recording in the recordings folder. A library folder is left alone.
      responses:
        "200":
          description: How many files were written
          content:
            application/json:
              schema:
                type: object
                required: [written]
                properties:
                  written: { type: integer }
        "409": { $ref: "#/components/responses/Error" }
  /recordings/{id}:
    delete:
      tags: [recordings]
      operationId: deleteRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /recordings/{id}/stop:
    post:
      tags: [recordings]
      operationId: stopRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /recordings/{id}/play:
    post:
      tags: [recordings]
      operationId: playRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
      responses:
        "200":
          description: Playback for a finished or in-progress recording
          content:
            application/json:
              schema:
                type: object
                required: [playlist, recording, position, growing, markers]
                properties:
                  playlist: { type: string }
                  recording: { $ref: "#/components/schemas/Recording" }
                  position: { type: number, description: "Where playback starts, in seconds. A saved spot in the first two seconds, past the known length, or on a recording whose length is unknown starts at the beginning." }
                  growing: { type: boolean, description: "True while the recording is still being written" }
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /recordings/{id}/progress:
    put:
      tags: [recordings]
      operationId: saveProgress
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: number, minimum: 0 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  position: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/watched:
    put:
      tags: [recordings]
      operationId: setWatched
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watched]
              properties:
                watched: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, watched]
                properties:
                  ok: { type: boolean }
                  watched: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/keep:
    put:
      tags: [recordings]
      operationId: setKeep
      description: Keep a recording forever (no keep rule, watched clean-up, or low-space clean-up removes it), or let clean-up see it again.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, keep]
                properties:
                  ok: { type: boolean }
                  keep: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/move:
    post:
      tags: [recordings]
      operationId: moveRecording
      description: Rename a finished recording, or move it into a folder, inside the recordings folder. Its .edl, .json, and .nfo go with it. The extension stays the recording's own.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "Path inside the recordings folder, such as Harbor Watch/S01E02. Subfolders are made as needed." }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                required: [ok, file]
                properties:
                  ok: { type: boolean }
                  file: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /recordings/{id}/file:
    get:
      tags: [recordings]
      operationId: downloadRecording
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The original broadcast
          content:
            video/mp2t:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/again:
    get:
      tags: [recordings]
      operationId: recordAgain
      description: The next airing of the recording's episode in the guide, on the channel a simulcast pair records, for Record it again. Record it with POST /passes (kind once, airingStart).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The next airing; airing is null when the guide has none.
          content:
            application/json:
              schema:
                type: object
                required: [airing]
                properties:
                  airing:
                    description: Null when the guide has no later airing of this episode.
                    anyOf:
                      - $ref: "#/components/schemas/Airing"
                      - type: "null"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recordings/{id}/markers:
    get:
      tags: [recordings]
      operationId: listMarkers
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Commercial markers
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [recordings]
      operationId: addMarker
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'A body that is not JSON, or whose end is not greater than start, is 400 and the message is "start and end required". A negative start is accepted when end is greater.'
              required: [start, end]
              properties:
                start: { type: number }
                end: { type: number }
      responses:
        "200":
          description: Marker added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marker" }
        "400": { $ref: "#/components/responses/Error" }
  /recordings/{id}/detect:
    post:
      tags: [recordings]
      operationId: detectBreaks
      description: Find commercial breaks (comskip when installed, otherwise black frames).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Markers after detection
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /markers/{id}:
    delete:
      tags: [recordings]
      operationId: deleteMarker
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /schedule:
    get:
      tags: [dvr]
      operationId: getSchedule
      description: Upcoming recordings from passes for the next 14 days, with conflicts marked and a later airing when one fits.
      responses:
        "200":
          description: Planned recordings
          content:
            application/json:
              schema:
                type: object
                required: [tunerCount, items]
                properties:
                  tunerCount: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PlannedAiring" }
  /schedule/skip:
    post:
      tags: [dvr]
      operationId: skipAiring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start]
              properties:
                programId: { type: string }
                title: { type: string }
                subtitle: { type: string }
                channelId: { type: integer, format: int64 }
                start:
                  type: string
                  format: date-time
                  description: An offset is accepted and stored as UTC, which is how the skip is matched. A missing or unreadable time is 400.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /schedule/fix:
    post:
      tags: [dvr]
      operationId: fixSchedule
      description: Record the suggested later airing instead of a skipped one. When the pass cannot name that airing, a once pass records it alone. Does not raise priority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passId, channelId, start, suggestionChannelId, suggestionStart]
              properties:
                passId: { type: integer, format: int64 }
                channelId: { type: integer, format: int64, description: "Channel of the skipped airing." }
                start: { type: string, format: date-time, description: "Start of the skipped airing." }
                suggestionChannelId: { type: integer, format: int64 }
                suggestionStart: { type: string, format: date-time }
      responses:
        "200":
          description: Schedule after the change
          content:
            application/json:
              schema:
                type: object
                required: [tunerCount, items]
                properties:
                  tunerCount: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PlannedAiring" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /passes:
    get:
      tags: [dvr]
      operationId: listPasses
      responses:
        "200":
          description: Passes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
    post:
      tags: [dvr]
      operationId: addPass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPass" }
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
        "400": { $ref: "#/components/responses/Error" }
  /passes/order:
    put:
      tags: [dvr]
      operationId: orderPasses
      description: Rank passes, first highest. Omitted or empty ids leaves order. Ids that are gone or repeated are skipped; a pass not named ranks last.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
        "400": { $ref: "#/components/responses/Error" }
  /passes/preview:
    post:
      tags: [dvr]
      operationId: previewPass
      description: Plan the next 14 days as if this pass were saved. With id, the rules edit that pass (rename for a new title); without, it is a new series pass. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Nothing is saved. When id is absent or 0, title is required and rename is ignored. When id is any other number, title is ignored and a non-blank rename is the new title, words, or category. A missing pass is not found."
              properties:
                id:
                  type: integer
                  format: int64
                  description: "Absent or 0 previews a new series pass. Any other id previews an edit of that pass."
                title:
                  type: string
                  description: "Required when id is absent or 0. Blank is refused. Ignored when id is any other number."
                rename:
                  type: string
                  description: "Ignored when id is absent or 0, because the new title is title. When id is set, a non-blank value replaces the title. Blank keeps the saved title. A team pass keeps its title."
                channelId:
                  type: integer
                  format: int64
                  description: "0 records on any channel. A once pass does not store it."
                padBefore:
                  type: integer
                  description: "Stored from 0 to 30."
                padAfter:
                  type: integer
                  description: "Stored from 0 to 30."
                airingStart:
                  type: string
                  description: "Ignored. This route does not record one airing. POST /passes does, when airingStart and channelId are set."
                matchKind:
                  type: string
                  enum: [title, contains, category]
                  description: "team is refused. A team pass keeps the match kind it already has. A once pass does not store it."
                priority:
                  type: integer
                  description: "Stored from 0 to 1000."
                episodes:
                  type: string
                  enum: [all, new]
                  description: "A once pass does not store it. A word other than all or new is refused, including on a once pass."
                keepMode:
                  type: string
                  enum: [all, unwatched, last]
                  description: "A once pass does not store it. A word other than all, unwatched, or last is refused, including on a once pass."
                keepCount:
                  type: integer
                  description: "Stored from 0 to 99. A once pass does not store it."
                limitCount:
                  type: integer
                  description: "Stored from 0 to 99. A once pass does not store it."
                rerecord:
                  type: boolean
                  description: "A once pass does not store it."
                commercials: { type: boolean }
                timeStart:
                  type: string
                  description: "HH:MM local. Set with timeEnd. Checked only when timeStart or timeEnd is sent, including on a once pass. A once pass does not store it."
                timeEnd:
                  type: string
                  description: "HH:MM local. Before timeStart crosses midnight. Checked only when timeStart or timeEnd is sent, including on a once pass. A once pass does not store it."
                days:
                  type: array
                  description: "Weekdays an airing may start on, 0 Sunday to 6 Saturday. Empty is every day. A bad entry is refused, including on a once pass. A once pass does not store it."
                  items: { type: integer, minimum: 0, maximum: 6 }
              if:
                anyOf:
                  - not:
                      required: [id]
                  - properties:
                      id:
                        const: 0
              then:
                required: [title]
      responses:
        "200":
          description: What the pass would record, and recordings of other passes it would push out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /passes/{id}:
    patch:
      tags: [dvr]
      operationId: updatePass
      description: Changes only the fields sent. title is ignored; rename changes a series pass's title. A time window is checked only when one is sent.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Changes only the fields sent. The body must be JSON. No field is required. id and title are ignored; the path id is the pass. rename changes a series pass's title. A time window is checked only when timeStart or timeEnd is sent."
              properties:
                id:
                  type: integer
                  format: int64
                  description: "Ignored. The path id is the pass."
                title:
                  type: string
                  description: "Ignored. Send rename to change a series pass's title."
                rename:
                  type: string
                  description: "New title, words, or category for a series pass. Blank is ignored. A team pass keeps its title. A once pass does not store it."
                channelId:
                  type: integer
                  format: int64
                  description: "0 records on any channel. A once pass does not store it."
                kind:
                  type: string
                  description: "Ignored."
                padBefore:
                  type: integer
                  description: "Stored from 0 to 30."
                padAfter:
                  type: integer
                  description: "Stored from 0 to 30."
                priority:
                  type: integer
                  description: "Stored from 0 to 1000."
                episodes:
                  type: string
                  enum: [all, new]
                  description: "A once pass does not store it. A word other than all or new is refused, including on a once pass."
                keepMode:
                  type: string
                  enum: [all, unwatched, last]
                  description: "A once pass does not store it. A word other than all, unwatched, or last is refused, including on a once pass."
                keepCount:
                  type: integer
                  description: "Stored from 0 to 99. A once pass does not store it."
                limitCount:
                  type: integer
                  description: "Stored from 0 to 99. A once pass does not store it."
                rerecord:
                  type: boolean
                  description: "A once pass does not store it."
                commercials: { type: boolean }
                timeStart:
                  type: string
                  description: "HH:MM local. Checked only when timeStart or timeEnd is sent, including on a once pass. A once pass does not store it."
                timeEnd:
                  type: string
                  description: "HH:MM local. Checked only when timeStart or timeEnd is sent, including on a once pass. A once pass does not store it."
                matchKind:
                  type: string
                  enum: [title, contains, category]
                  description: "team is refused. A team pass keeps the match kind it already has. A once pass does not store it."
                days:
                  type: array
                  description: "Weekdays an airing may start on, 0 Sunday to 6 Saturday. Empty is every day. A bad entry is refused, including on a once pass. A once pass does not store it."
                  items: { type: integer, minimum: 0, maximum: 6 }
                airingStart:
                  type: string
                  description: "Ignored."
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [dvr]
      operationId: deletePass
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Passes after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /teams:
    get:
      tags: [dvr]
      operationId: listTeams
      responses:
        "200":
          description: Teams this household follows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
    put:
      tags: [dvr]
      operationId: followTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamFollow" }
      responses:
        "200":
          description: Teams after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "400": { $ref: "#/components/responses/Error" }
  /teams/{id}:
    delete:
      tags: [dvr]
      operationId: unfollowTeam
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Teams after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /events:
    get:
      tags: [server]
      operationId: listEvents
      responses:
        "200":
          description: Recent activity. Record scope. Rows can name a recording or a source error.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
  /virtuals:
    get:
      tags: [virtuals]
      operationId: listVirtuals
      responses:
        "200":
          description: Library channels
          content:
            application/json:
              schema:
                type: object
                required: [virtuals]
                properties:
                  virtuals:
                    type: array
                    items: { $ref: "#/components/schemas/VirtualChannel" }
    post:
      tags: [virtuals]
      operationId: createVirtual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                number: { type: string }
                name: { type: string }
                recordings:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualChannel" }
        "400": { $ref: "#/components/responses/Error" }
  /virtuals/{id}:
    patch:
      tags: [virtuals]
      operationId: updateVirtual
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderMode:
                  type: string
                  enum: [custom, release, random, season, show, marathon]
                  description: "Omitted or empty leaves the saved order. Any other word is refused."
                ruleTitle:
                  type: string
                  description: Omitted leaves the saved title.
                recordings:
                  type: array
                  description: Omitted leaves the saved list. An empty array clears it.
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualChannel" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /virtuals/schedule:
    get:
      tags: [virtuals]
      operationId: virtualSchedule
      responses:
        "200":
          description: Library channel slots for the next 48 hours
          content:
            application/json:
              schema:
                type: object
                required: [virtuals]
                properties:
                  virtuals:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/VirtualChannel"
                        - type: object
                          properties:
                            slots:
                              type: array
                              items: { $ref: "#/components/schemas/Slot" }
  /virtuals/{id}/play:
    post:
      tags: [virtuals]
      operationId: playVirtual
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "The body must be JSON. An empty body is refused. index may be omitted; omitted is 0, the first recording."
              properties:
                index:
                  type: integer
                  minimum: 0
                  description: "Position in the channel's recording list. Omitted is 0. Below 0 is refused. At or past the end of the list is refused."
                pictureMode: { $ref: "#/components/schemas/PictureMode" }
      responses:
        "200":
          description: Playback for one recording on the channel. Uses no tuner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usesTuner: { type: boolean }
                  index: { type: integer }
                  count: { type: integer }
                  playlist: { type: string }
                  number: { type: string }
                  name: { type: string }
                  recording: { $ref: "#/components/schemas/Recording" }
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pair:
    post:
      tags: [pairing]
      operationId: startPair
      description: |
        A new device asks to be paired and shows the code. Poll `GET /pair/{id}` with the
        poll secret until an admin approves it. The code lasts 10 minutes. Sign-in is not required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  description: Counted in characters. A name that is only spaces is 400.
                kind:
                  type: string
                  enum: [phone, tv, web, other]
                  description: Compared exactly after trimming spaces. Any other value, including a different case, is stored as other. The response is still 201.
                scopes:
                  type: array
                  description: Compared without regard to case, and surrounding spaces are ignored. An unknown scope is 400. Omitted, empty, or only blank entries is watch.
                  items: { type: string, enum: [watch, record, admin] }
      responses:
        "201":
          description: Code for the device to show
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairTicket" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /pair/code:
    post:
      tags: [pairing]
      operationId: createPairCode
      description: |
        An admin shows a code for another device to enter. While device sign-in is off, anyone
        on the home network may call this. While it is on, the caller needs admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 63
                  description: Optional. Counted in characters after trimming spaces. A name that is only spaces is stored as empty.
                kind:
                  type: string
                  enum: [phone, tv, web, other]
                  description: Compared exactly after trimming spaces. Any other value, including a different case, is stored as other. The response is still 201.
                scopes:
                  type: array
                  description: Compared without regard to case, and surrounding spaces are ignored. An unknown scope is 400. Omitted, empty, or only blank entries is watch.
                  items: { type: string, enum: [watch, record, admin] }
      responses:
        "201":
          description: Code for the other device to enter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairTicket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /pair/approve:
    post:
      tags: [pairing]
      operationId: approvePair
      description: |
        Approves a code a device is showing. The token is delivered to that device's next poll,
        not in this response. Scopes here replace the ones the device asked for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "Six digits. Spaces and dashes are ignored." }
                scopes:
                  type: array
                  description: Replaces the scopes the device asked for. Compared without regard to case, and surrounding spaces are ignored. An unknown scope is 400. Omitted, empty, or only blank entries is watch.
                  items: { type: string, enum: [watch, record, admin] }
      responses:
        "200":
          description: The device that may now sign in
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device: { $ref: "#/components/schemas/ClientDevice" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /pair/claim:
    post:
      tags: [pairing]
      operationId: claimPair
      description: |
        A device enters a code an admin is showing, or an invite code
        (twelve letters and digits, dashes and case ignored), and receives its token once.
        The response also sets the `bw_token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  description: Counted in characters. A name that is only spaces is 400.
                kind:
                  type: string
                  enum: [phone, tv, web, other]
                  description: Omitted keeps the kind stored with the code. Otherwise compared exactly after trimming spaces. Any other value, including a different case, is stored as other. The response is still 201.
      responses:
        "201":
          description: Token for this device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /pair/{id}:
    get:
      tags: [pairing]
      operationId: pollPair
      description: |
        The device that called `POST /pair` polls with its poll secret.
        `token` is present on the poll that finds the pairing approved, and not again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: secret
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pending, approved, expired, or denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairPoll" }
        "404": { $ref: "#/components/responses/Error" }
  /remote:
    get:
      tags: [pairing]
      operationId: getRemote
      description: |
        Away from home. The public address, the built-in Cloudflare tunnel, and the
        invites nobody has used. Requests that arrive through Cloudflare (a
        `Cf-Connecting-Ip` or `Cf-Ray` header) or by the public name always need a
        paired device, `/export` included. The home network is unchanged.
      responses:
        "200":
          description: Remote access status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /remote/cloudflare:
    get:
      tags: [pairing]
      operationId: getCloudflare
      description: |
        Sign in with Cloudflare. The sign-in, the setup steps, or the tunnel it made.
        Admin, and only from the home network: a request through the tunnel or the
        public name is refused with `not_home`. A `remote.changed` event on the
        socket says to read it again.
      responses:
        "200":
          description: Where the sign-in stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [pairing]
      operationId: removeCloudflare
      description: |
        Stops the tunnel Broadwave runs and forgets its token. The public address is
        cleared when it is the tunnel's. With `cloudflare=1` and a fresh sign-in
        (`state` authorized), the tunnel is also deleted in Cloudflare, and its DNS
        name when the sign-in may. `dnsLeft` names a DNS entry that may remain.
      parameters:
        - name: cloudflare
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Turned off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /remote/cloudflare/login:
    post:
      tags: [pairing]
      operationId: startCloudflareLogin
      description: |
        Starts a sign-in. Open `loginUrl` in a browser, pick a domain, and authorize.
        The server waits for Cloudflare in the background until `expiresAt` (about 9
        minutes), then the state is authorized. The certificate it gets controls every
        tunnel in the account, so it stays in memory and is dropped after setup, after
        15 minutes unused, or on cancel. Purpose `remove` deletes the tunnel in
        Cloudflare as soon as the sign-in finishes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [setup, remove], description: "Omitted is setup." }
      responses:
        "200":
          description: Waiting for the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [pairing]
      operationId: cancelCloudflareLogin
      description: Stops waiting, drops the certificate, and clears an error. Setup that is running finishes on its own.
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /remote/cloudflare/setup:
    post:
      tags: [pairing]
      operationId: setupCloudflare
      description: |
        After the sign-in: makes a tunnel named `broadwave-` and the start of the
        server's id (or uses this server's own again), points `label.<domain>` at it,
        saves the tunnel's run token in the config folder (never the catalog), sets the
        public address, starts cloudflared, and drops the certificate. It runs in the
        background through the steps tunnel, dns, and connect. A name already in DNS
        comes back as state authorized with error `name_taken`; send `overwrite` to
        replace it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, description: "The first part of the name, such as tv. When zone.name is empty, the whole name, such as tv.example.com." }
                overwrite: { type: boolean, description: "Replace a DNS entry that already has this name." }
      responses:
        "202":
          description: Setup started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /invites:
    get:
      tags: [pairing]
      operationId: listInvites
      description: Invites nobody has used yet. Codes are not included.
      responses:
        "200":
          description: Waiting invites
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [pairing]
      operationId: createInvite
      description: |
        A code for someone outside the house. It lasts 7 days and pairs one device
        through `POST /pair/claim`. The code is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 63, description: "Who the invite is for." }
                scopes:
                  type: array
                  items: { type: string, enum: [watch, record, admin] }
                  description: Omitted is watch.
      responses:
        "201":
          description: The invite and its code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /invites/{id}:
    delete:
      tags: [pairing]
      operationId: deleteInvite
      description: Stops an invite nobody has used.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Waiting invites
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /clients:
    get:
      tags: [pairing]
      operationId: listClients
      description: Paired phones, TVs, and browsers. Tuner hardware stays on `/devices`. Tokens are not included.
      responses:
        "200":
          description: Devices that have not been revoked
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/ClientDevice" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /media/link:
    post:
      tags: [pairing]
      operationId: mediaLink
      description: |
        A link to a playlist or file under `/media/` that plays without a header or
        cookie, for a device that cannot carry the token: an AirPlay or Google Cast
        receiver, or a player handed a URL. The link adds `mk=` to the path and lasts
        24 hours. Playlists fetched with it name every segment, part, and other
        playlist with the same `mk`, so the whole stream plays. The link stops working
        when this device is revoked. Watch scope. While sign-in is off and the request
        is from the home network, the same call still answers, so apps need no special case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "A path under /media/, such as /media/live/28/1080.aac2.broadcast/index.m3u8. A query is kept." }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /clients/me:
    get:
      tags: [pairing]
      operationId: getClient
      description: The device for the token on this request. With no token, `device` is null and `auth` says whether sign-in is on.
      responses:
        "200":
          description: This device, or an empty seat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientSeat" }
  /clients/{id}:
    delete:
      tags: [pairing]
      operationId: revokeClient
      description: Revokes a device. Its token stops working immediately. While sign-in is on, the last admin device cannot be revoked (409).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The devices that remain
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/ClientDevice" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /playback:
    get:
      tags: [settings]
      operationId: getPlayback
      summary: Picture choices a watching device may see.
      description: |
        pictureMode, autoplay, and layout. The guide address and sign-in stay on GET /settings, which is for an admin.
      responses:
        "200":
          description: Playback choices, with the same defaults as settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playback" }
  /channels/{id}/reception:
    get:
      tags: [channels]
      operationId: channelReception
      summary: Why a picture stalled, without tuner inventory.
      description: |
        Whether a tuner is free, whether a tuner answered, and whether this channel's signal is lost.
        Tuner addresses, firmware, and frequency stay on the admin routes.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Three yes or no answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reception" }
        "400": { $ref: "#/components/responses/Error" }
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        "200":
          description: Settings with defaults filled in
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "304":
          description: Not modified. No body. If-None-Match matched the ETag.
    put:
      tags: [settings]
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
  /setup/finish:
    post:
      tags: [settings]
      operationId: startSetupFinish
      description: |
        After a tuner is in the lineup, finish setup on the server.
        Scan when the lineup is empty, load listings, check the recordings folder,
        star ABC, CBS, FOX, and NBC, time the encoder, and summarize the antenna.
        Poll GET until running is false. The ready line is the summary.
      responses:
        "200":
          description: Setup progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupFinish" }
        "415": { $ref: "#/components/responses/Error" }
    get:
      tags: [settings]
      operationId: setupFinishStatus
      description: Progress for the setup that is finishing itself.
      responses:
        "200":
          description: Setup progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupFinish" }
  /storage:
    get:
      tags: [settings]
      operationId: getStorage
      responses:
        "200":
          description: Recordings disk
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string, description: "The recordings folder as the server sees it. In a container it is the folder mounted at /config/work/recordings." }
                  freeBytes: { type: integer, format: int64 }
                  totalBytes: { type: integer, format: int64 }
                  watermarkGB: { type: integer }
        "503": { $ref: "#/components/responses/Error" }
  /storage/shows:
    get:
      tags: [settings]
      operationId: storageShows
      description: |
        Finished recordings in the recordings folder, grouped by title.
        A recording still in progress is left out, and so is a file in a library folder.
      responses:
        "200":
          description: Shows, largest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageShows" }
        "503": { $ref: "#/components/responses/Error" }
  /storage/plan:
    get:
      tags: [settings]
      operationId: getStoragePlan
      description: |
        What the storage rules would remove, which recordings they would leave, and which damaged recordings can be recorded again.
        Nothing is deleted. An admin call when device sign-in is on.
      responses:
        "200":
          description: The clean-up that would run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoragePlan" }
  /backup:
    get:
      tags: [settings]
      operationId: downloadBackup
      responses:
        "200":
          description: Catalog database (channels edits, passes, markers, settings). Video files are not included.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [settings]
      operationId: restoreBackup
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "503": { $ref: "#/components/responses/Error" }
  /backups:
    get:
      tags: [settings]
      operationId: listBackups
      description: Catalog copies on this server. Video files are not included.
      responses:
        "200":
          description: Saved catalog copies, newest first
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogBackup" }
  /backups/{name}:
    get:
      tags: [settings]
      operationId: downloadCatalogBackup
      description: One saved catalog copy. Video files are not included.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Catalog database
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /backups/{name}/restore:
    post:
      tags: [settings]
      operationId: restoreCatalogBackup
      description: Put the catalog back to this copy. Recordings on disk are left in place.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
  /support:
    get:
      tags: [settings]
      operationId: downloadSupport
      description: Zip of recent logs, versions, doctor results, and redacted settings. Passwords and tuner DeviceAuth are left out.
      responses:
        "200":
          description: Support bundle
          content:
            application/zip:
              schema: { type: string, format: binary }
  /export/lineup.m3u:
    servers:
      - url: http://localhost:8477
    get:
      tags: [channels]
      operationId: exportLineup
      description: |
        M3U of the guide lineup for other apps: every present, enabled, visible channel, once each, pointing at `/export/stream/{id}`. Library channels are not listed. A shared multiview whose channels are all still in the lineup points at `/export/mosaic/{key}`. The playlist names `/export/guide.xml`. Device sign-in does not cover `/export`.
      responses:
        "200":
          description: Playlist. Content-Type is audio/x-mpegurl; charset=utf-8.
          content:
            audio/x-mpegurl:
              schema: { type: string }
  /export/guide.xml:
    servers:
      - url: http://localhost:8477
    get:
      tags: [guide]
      operationId: exportGuide
      description: |
        XMLTV for the same lineup, from two hours ago through 14 days ahead. A channel id is `ota.` plus the display number with dots as dashes; a shared multiview is `mosaic.` plus its key, with two-hour Multiview blocks so apps that hide guideless channels still list it. Device sign-in does not cover `/export`.
      responses:
        "200":
          description: XMLTV document. Content-Type is application/xml; charset=utf-8.
          content:
            application/xml:
              schema: { type: string }
  /export/stream/{id}:
    servers:
      - url: http://localhost:8477
    get:
      tags: [live]
      operationId: exportStream
      description: |
        The channel's broadcast as MPEG-TS, riding the shared tune. Device sign-in does not cover `/export`; a cross-site browser page is refused with 403. HEAD does not tune. An id the server does not know is 503 on GET, not 404. A failure after the first byte stays 200.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MPEG-TS. Content-Type is video/mp2t. HEAD has an empty body and does not tune.
          content:
            video/mp2t:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            Plain text. The id is not an integer, or live TV is not set up.
          content:
            text/plain:
              schema: { type: string }
        "429":
          description: |
            Plain text. Every app stream is already in use.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: |
            Plain text, GET only. "805 All Tuners In Use" when every tuner is busy, otherwise "806 Tune Failed", also sent as X-HDHomeRun-Error.
          headers:
            X-HDHomeRun-Error:
              schema: { type: string }
              description: The body's sentence.
          content:
            text/plain:
              schema: { type: string }
  /export/mosaic/{key}:
    servers:
      - url: http://localhost:8477
    get:
      tags: [live]
      operationId: exportMosaic
      description: |
        A shared multiview as MPEG-TS. Only a mosaic in the export list whose channels are all still in the lineup is served. Device sign-in does not cover `/export`; a cross-site browser page is refused with 403. HEAD does not tune. A failure after the first byte stays 200.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Channel ids joined by hyphens, the sound channel first. Two to four different positive ids, with no leading zeros.
      responses:
        "200":
          description: MPEG-TS. Content-Type is video/mp2t. HEAD has an empty body and does not tune.
          content:
            video/mp2t:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            Plain text. The key is not a mosaic, live TV is not set up, or this mosaic is not shared.
          content:
            text/plain:
              schema: { type: string }
        "429":
          description: |
            Plain text. Every app stream is already in use.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: |
            Plain text, GET only. When every tuner is busy, X-HDHomeRun-Error is "805 All Tuners In Use".
          headers:
            X-HDHomeRun-Error:
              schema: { type: string }
              description: Set only when every tuner is busy.
          content:
            text/plain:
              schema: { type: string }
  /media/poster/{id}:
    servers:
      - url: http://localhost:8477
    get:
      tags: [recordings]
      operationId: recordingPoster
      description: |
        JPEG still from a recording.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: JPEG poster. Content-Type is image/jpeg. Cache-Control is public, max-age=3600.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404":
          description: |
            Plain text. No such recording, or no poster could be made.
          content:
            text/plain:
              schema: { type: string }
  /media/art/{kind}/{id}:
    servers:
      - url: http://localhost:8477
    get:
      tags: [guide]
      operationId: getArt
      description: |
        A channel logo or a listing picture, re-encoded as JPEG, or PNG when it has transparency. When there is no picture or it cannot be used, the answer is an SVG placeholder with 200.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [channel, airing] }
          description: channel is a logo. airing is a listing picture. Anything else is 404.
        - $ref: "#/components/parameters/Id"
        - in: query
          name: w
          schema: { type: integer, default: 320 }
          description: Width in pixels, from 32 to 960. A smaller picture is not enlarged.
      responses:
        "200":
          description: |
            The picture, cached for a day, or the placeholder, cached for an hour.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        "404":
          description: |
            Plain text. The id is not a positive integer, the kind is not channel or airing, or the row is missing.
          content:
            text/plain:
              schema: { type: string }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ClientDevice:
      type: object
      required: [id, name, kind, scopes, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [phone, tv, web, other] }
        scopes:
          type: array
          items: { type: string, enum: [watch, record, admin] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    MediaLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, description: "A path with mk= added. Resolve it against the server address." }
        expiresAt: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, name, scopes, createdAt, expiresAt]
      properties:
        id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [watch, record, admin] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    InviteGrant:
      type: object
      required: [invite, code]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        code: { type: string, description: "Twelve characters in groups of four, such as K7QM-4XPA-9RTW." }
        link: { type: string, description: "The web page that pairs with this code. Present when the server has a public address." }
        appLink: { type: string, description: "broadwave://join?server=…&code=… for the iPhone and iPad apps. Present when the server has a public address." }
    TunnelStatus:
      type: object
      required: [state, connections]
      properties:
        state: { type: string, enum: [off, missing, starting, connected, error] }
        message: { type: string }
        hostnames:
          type: array
          items: { type: string }
          description: Public hostnames on the tunnel, as Cloudflare reported them.
        connections: { type: integer }
        since: { type: string, format: date-time }
    CloudflareStatus:
      type: object
      required: [state, managed, tunnel]
      properties:
        state: { type: string, enum: [idle, waiting, authorized, provisioning, connected, error] }
        purpose: { type: string, enum: [setup, remove] }
        loginUrl: { type: string, description: "Open this to sign in. While waiting." }
        expiresAt: { type: string, format: date-time, description: "When waiting or the held sign-in ends." }
        zone: { $ref: "#/components/schemas/CloudflareZone" }
        hostname: { type: string, description: "The name being set up, or the one in use." }
        step: { type: string, enum: [tunnel, dns, connect], description: "While provisioning." }
        error: { $ref: "#/components/schemas/CloudflareProblem" }
        dnsLeft: { type: string, description: "After turning off: a DNS name that may still point at the removed tunnel." }
        managed: { type: boolean, description: "A tunnel Broadwave made is saved and runs." }
        tunnel: { $ref: "#/components/schemas/TunnelStatus" }
    CloudflareZone:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string, description: "The domain. Empty when the sign-in may not read it; then setup takes the whole name." }
    CloudflareProblem:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "timeout, login_failed, no_zone, bad_cert, name_taken, not_permitted, setup_failed, wrong_account, remove_failed." }
        message: { type: string }
    RemoteStatus:
      type: object
      required: [remoteUrl, configured, tokenSet, tunnel, deviceAuth, invites, here]
      properties:
        remoteUrl: { type: string, description: "The address in use: the saved one, or the tunnel's hostname. Empty when there is none." }
        configured: { type: string, description: "The saved remoteUrl setting." }
        tokenSet: { type: boolean }
        tunnel: { $ref: "#/components/schemas/TunnelStatus" }
        deviceAuth: { type: boolean }
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
        here: { type: boolean, description: "This request came from outside the house." }
    PairTicket:
      type: object
      required: [id, code, expiresAt]
      properties:
        id: { type: string }
        code: { type: string, description: "Six digits." }
        expiresAt: { type: string, format: date-time }
        pollSecret: { type: string, description: "Present when the device shows the code. Send it as secret on the poll." }
    PairGrant:
      type: object
      required: [token, device]
      properties:
        token: { type: string }
        device: { $ref: "#/components/schemas/ClientDevice" }
    PairPoll:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending, approved, expired, denied] }
        expiresAt: { type: string, format: date-time }
        token: { type: string }
        device: { $ref: "#/components/schemas/ClientDevice" }
    ClientSeat:
      type: object
      required: [auth]
      properties:
        auth: { type: string, enum: [local-open, device] }
        device:
          anyOf:
            - $ref: "#/components/schemas/ClientDevice"
            - type: "null"
    Error:
      type: object
      required: [code, message]
      additionalProperties: true
      properties:
        code:
          type: string
          description: |
            Stable machine code. An unknown code is still a failure.
            Known codes: already_on, bad_name, bad_request, busy, conflict, device_busy, disk_low, error, expired, exports_full, forbidden, guide_rate_limited, internal, name_taken, no_signal, no_source, not_found, not_home, not_signed_in, pictures_full, rate_limited, recording_soon, remove_failed, start_failed, stream_down, streams_full, tuner_refused, tuner_silent, tuners_busy, unauthorized, unavailable, wrong_account.
        message: { type: string, description: Short text safe to show a user. }
        tuners:
          type: array
          items: { $ref: "#/components/schemas/Tuner" }
        tiles: { type: integer, description: "How many pictures this server can play at once, when the code is pictures_full." }
        freeBytes: { type: integer, format: int64 }
        needBytes: { type: integer, format: int64 }
        limit: { type: integer, description: "The stream or export cap, when the code is streams_full or exports_full." }
        retryAt: { type: string, format: date-time, description: "When another try is allowed, when the code is guide_rate_limited." }
    RoomState:
      type: object
      required: [room, mode, anchorServer, anchorMedia, rate, latency, version, members]
      properties:
        room: { type: string }
        channelId: { type: integer, format: int64 }
        mode: { type: string, enum: [follow, group] }
        anchorServer: { type: number, description: "Server Unix ms when the anchor was set" }
        anchorMedia: { type: number, description: "Program date-time (Unix ms) playing at anchorServer" }
        rate: { type: number, description: "1, 0 when paused, or below 1 while a follow room eases back to its latency" }
        latency: { type: string, enum: [lowest, balanced, stable] }
        latencyMs: { type: number, description: "How far behind server time the room settles. A screen that cannot reach an easing room's frame aims at server time minus this." }
        version: { type: integer }
        members: { type: integer }
        synced: { type: boolean, description: "Someone chose Sync screens: every screen on this channel lines up with the room, including screens that don't line up on their own. A new room starts false." }
        people:
          type: array
          description: Group rooms only. Who is in the room; a screen that has not said what it is has an empty name and kind.
          items: { $ref: "#/components/schemas/Person" }
    Screen:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, description: "iphone, ipad, appletv, or web" }
        channelId: { type: integer, format: int64, description: "The live channel it is watching; absent when none or in a multiview" }
    Person:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, description: "iphone, ipad, appletv, web, or empty" }
    ServerInfo:
      type: object
      required: [id, name, version, apiVersion, features]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        apiVersion: { type: integer }
        encoder: { type: string }
        tunerCount: { type: integer }
        features:
          type: array
          items: { type: string }
        minAppVersion:
          type: string
          description: "Oldest app version this server supports, for example 1.0. Omitted by the previous release. The app compares its own version. An older app is still served."
        discoveryKey:
          type: string
          description: "Base64 Ed25519 public key. The app stores it from this response and later requires a matching signature before it follows the server to a new address. Omitted when this build has no key."
        update:
          $ref: "#/components/schemas/ServerUpdate"
          description: "Present when a newer release is available. Omitted when this build is current or the check is off."
        castAppId:
          type: string
          description: "Google Cast application id from BROADWAVE_CAST_APP_ID. Omitted when unset or not 4 to 32 letters and digits. The web player shows Cast only when this is set."
    ServerUpdate:
      type: object
      required: [version, notesUrl, message]
      description: "A newer Broadwave release. The message is the banner."
      properties:
        version: { type: string, description: "Release tag without a leading v." }
        notesUrl: { type: string, description: "Release notes page." }
        message: { type: string, description: "Banner text, for example Broadwave 0.7 is available." }
    Device:
      type: object
      required: [deviceId, friendlyName, baseUrl, tunerCount]
      properties:
        deviceId: { type: string }
        friendlyName: { type: string }
        modelNumber: { type: string }
        firmwareName: { type: string }
        firmwareVersion: { type: string }
        upgradeAvailable: { type: string }
        baseUrl: { type: string }
        lineupUrl: { type: string }
        tunerCount: { type: integer }
        priority: { type: integer }
        lastSeen: { type: string }
        note: { type: string }
        offline:
          type: boolean
          description: True when a tuner has missed three discovery rounds (15 minutes). Playlists use source health instead. Never true for a retired tuner.
        retired:
          type: boolean
          description: The owner took this tuner away on purpose (PATCH /devices/{id}). It counts toward no recording plan and raises no note. Cleared when it answers again. Absent when false.
    DeviceHealth:
      type: object
      required: [deviceId, model, firmwareVersion, tuners]
      description: Live model, firmware version, and signal lock. Empty error means the tuner answered.
      properties:
        deviceId: { type: string }
        model: { type: string }
        firmwareVersion: { type: string }
        tuners:
          type: array
          items: { $ref: "#/components/schemas/TunerLock" }
        error: { type: string, description: "Set when the tuner did not answer." }
    TunerLock:
      type: object
      required: [index, locked]
      description: Signal lock for one tuner. Locked is false when the device reports no lock.
      properties:
        index: { type: integer }
        locked: { type: boolean }
    Source:
      type: object
      additionalProperties: false
      required: [id, kind, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          description: |
            How this source was added. A Channels server added from the form is `channels`.
            `hdhomerun`, `hdhr-compatible`, and `channels-dvr` are discovery names; tuners themselves are devices.
          enum: [hdhomerun, hdhr-compatible, m3u, xtream, tvheadend, channels, channels-dvr, threadfin, xteve, ersatztv, dispatcharr, free, link, folder]
        name: { type: string }
        url: { type: string }
        xmltvUrl: { type: string }
        enabled: { type: boolean }
        stableKey: { type: string }
        priority: { type: integer }
        tunerCount: { type: integer }
        streamLimit: { type: integer }
        streamFormat: { type: string, description: "ts, mpegts, or hls, empty until the source is probed." }
        hasGuide: { type: boolean }
        needsTuner: { type: boolean }
        refresh: { type: string, description: "When this source will be fetched again." }
        lastRefresh: { type: string }
        health: { type: string, description: "Empty when the source is online. Otherwise the last error." }
        streamsInUse: { type: integer }
        deviceId: { type: string }
        groups: { type: string, description: "Group filter saved with this playlist. Empty keeps every group. The add response is the source from before this is saved; GET /sources has it." }
        start: { type: integer, description: "First channel number saved with this playlist. 0 keeps the numbers in the playlist. Omitted until a number was set. The add response may omit it; GET /sources has it." }
    PlaylistPick:
      type: object
      additionalProperties: false
      required: [pick, count, message, groups]
      description: A long playlist was not saved. The next add names which groups or channels to keep.
      properties:
        pick: { type: boolean, enum: [true] }
        count: { type: integer, description: "Channels in the playlist." }
        message: { type: string }
        groups:
          type: array
          items: { type: string }
        channels:
          type: array
          description: Present when the playlist has no groups. Each row is one channel that can be kept.
          items:
            type: object
            additionalProperties: false
            required: [name, id, number]
            properties:
              name: { type: string }
              id: { type: string }
              number: { type: string }
    Channel:
      type: object
      required: [id, deviceId, guideNumber, guideName, displayNumber, displayName, hd, favorite, enabled, hidden, present]
      properties:
        id: { type: integer, format: int64 }
        deviceId: { type: string }
        guideNumber: { type: string }
        guideName: { type: string }
        displayNumber: { type: string }
        displayName: { type: string }
        videoCodec: { type: string }
        audioCodec: { type: string }
        hd: { type: boolean }
        favorite: { type: boolean }
        enabled: { type: boolean }
        hidden: { type: boolean }
        present: { type: boolean }
        guideKey: { type: string, description: "XMLTV channel id or call sign to use for this channel. Blank uses the number and call sign." }
        artUrl: { type: string, description: "Channel logo from the guide. Empty when the source has none." }
        artWidth: { type: integer, description: "Native logo width in pixels. Omitted until the picture has been measured." }
        artHeight: { type: integer, description: "Native logo height in pixels. Omitted until the picture has been measured." }
        network: { type: string, description: "ABC, CBS, FOX, or NBC when the server can tell. Empty otherwise." }
        protected: { type: boolean, description: "The tuner marks this channel DRM or copy protected (for example ATSC 3.0 DRM). It stays hidden; one with a clear 1.0 twin plays as that channel (playsAs)." }
        standard: { type: string, enum: [atsc3], description: "atsc3 for an ATSC 3.0 broadcast. Omitted for everything else." }
        twinId: { type: integer, format: int64, description: "The other channel of an ATSC 1.0 and 3.0 pair of the same station. Its listings are shared." }
        twinChoice: { type: string, enum: [atsc3, atsc1, both], description: "Which channel of the pair shows in the guide." }
        playsAs: { type: integer, format: int64, description: "An encrypted ATSC 3.0 channel's clear 1.0 channel of the same station. Watching or recording the encrypted channel plays this one." }
        sameAs: { type: integer, format: int64, description: "The row shown for this channel when another tuner on the same antenna carries it too. This row stays off the guide (guide=1) and still plays. A change to either row changes both." }
    ChannelPatch:
      type: object
      properties:
        favorite: { type: boolean }
        enabled: { type: boolean }
        hidden: { type: boolean }
        customName: { type: string }
        customNumber: { type: string }
        guideKey: { type: string }
        twinChoice:
          type: string
          enum: [atsc3, atsc1, both]
          description: Show the pair's ATSC 3.0 channel, its 1.0 channel, or both. The channel that stays keeps the favorite.
    FrameList:
      type: object
      required: [channels]
      description: Channel ids whose preview JPEG exists and is newer than 10 minutes.
      properties:
        channels:
          type: array
          items: { type: integer, format: int64 }
        noSignal:
          type: array
          description: |
            Channels whose last tune in the past 10 minutes found no signal. A watch of
            one fails with `no_signal` after a short check (about 2 s) instead of the full
            wait, and a tune of it that locks takes it off this list.
          items: { type: integer, format: int64 }
    Airing:
      type: object
      required: [id, channelId, title, start, end]
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        category: { type: string }
        programId: { type: string }
        new: { type: boolean }
        imageUrl: { type: string, description: "Program artwork from the guide. Empty when the source has none." }
        imageWidth: { type: integer, description: "Native artwork width in pixels. Omitted until the picture has been measured." }
        imageHeight: { type: integer, description: "Native artwork height in pixels. Omitted until the picture has been measured." }
        season: { type: integer, description: "1-based season. Omitted when the guide does not say." }
        episode: { type: integer, description: "1-based episode. Omitted when the guide does not say." }
        episodeLabel: { type: string }
        originalAir: { type: string, description: "YYYY-MM-DD or a year." }
        seriesId: { type: string }
        live: { type: boolean }
        premiere: { type: boolean }
        finale: { type: boolean }
        rating: { type: string }
        cast: { type: string }
        gameId: { type: string, description: "Scoreboard game this listing is. Empty when it is not a matched game." }
        guideSource: { type: string, description: "Where this listing came from: silicondust, schedules-direct, xmltv, playlist, or broadcast." }
        guideNumber: { type: string }
        channelName: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    Game:
      type: object
      required: [id, league, name, start, state]
      properties:
        id: { type: string }
        league: { type: string }
        name: { type: string }
        shortName: { type: string }
        start: { type: string, format: date-time }
        state: { type: string, description: "pre, in, or post" }
        completed: { type: boolean }
        detail: { type: string }
        clock: { type: string }
        period: { type: integer }
        broadcasts:
          type: array
          items: { type: string }
        teams:
          type: array
          items: { $ref: "#/components/schemas/SportsTeam" }
        redZone: { type: boolean, description: "The football is inside the opponent's 20." }
        powerPlay: { type: boolean, description: "A hockey team has a power play." }
        situation: { type: string, description: "Short live situation, such as Red zone or 1st and 10." }
    SportsTeam:
      type: object
      required: [name]
      properties:
        name: { type: string }
        short: { type: string }
        abbr: { type: string }
        score: { type: string }
        home: { type: boolean }
        color: { type: string }
        altColor: { type: string }
        logo: { type: string }
    SearchAiring:
      allOf:
        - $ref: "#/components/schemas/Airing"
        - type: object
          required: [guideNumber, channelName]
          properties:
            guideNumber: { type: string }
            channelName: { type: string }
    PictureMode:
      type: string
      enum: [broadcast, smooth, film]
      description: broadcast rebuilds interlaced video at 60 frames a second; smooth uses motion-compensated deinterlacing; film recovers 24p.
    Playback:
      type: object
      required: [pictureMode, autoplay, layout]
      properties:
        pictureMode: { $ref: "#/components/schemas/PictureMode" }
        autoplay: { type: string, enum: ["0", "1"] }
        layout: { type: string, enum: [auto, desktop, tv, phone] }
    Reception:
      type: object
      required: [freeTuner, tunerAnswers, signalLost]
      properties:
        freeTuner: { type: boolean, description: "A tuner has no channel on it." }
        tunerAnswers: { type: boolean, description: "An HDHomeRun answered, or this house has none." }
        signalLost: { type: boolean, description: "This channel is tuned right now and the tuner locked nothing." }
    Tuner:
      type: object
      required: [index, ours]
      properties:
        index: { type: integer }
        guide: { type: string }
        name: { type: string }
        target: { type: string }
        ours: { type: boolean }
        strength: { type: integer }
        quality: { type: integer }
        symbol: { type: integer }
        viewers: { type: integer }
    ChannelSignal:
      type: object
      required: [channelId, number, name]
      properties:
        channelId: { type: integer, format: int64 }
        number: { type: string }
        name: { type: string }
        frequencyHz: { type: integer }
        strength: { type: integer }
        quality: { type: integer }
        symbol: { type: integer }
        verdict: { type: string, enum: [Great, OK, Weak, Lost] }
        tip: { type: string }
        live: { type: boolean }
        checkedAt: { type: string, format: date-time }
    Caps:
      type: object
      description: What the client can decode and display.
      required: [platform, video, audio]
      properties:
        platform: { type: string, enum: [tvos, ios, ipados, macos, visionos, web] }
        video:
          type: array
          items: { type: string, enum: [h264, hevc, mpeg2] }
        audio:
          type: array
          items: { type: string, enum: [aac, ac3, eac3] }
        maxHeight: { type: integer }
        network: { type: string, enum: [lan, wifi, cellular, remote] }
        alternates:
          type: boolean
          description: |
            The player switches sound tracks in place from a master playlist. When the rendition
            carries more than one sound track, `mainPlaylist` is then that master.
    Prefs:
      type: object
      description: The viewer's choices. Empty means automatic.
      properties:
        quality: { type: string, enum: [auto, original, high, medium, saver, tile, "360", focus] }
        audio: { type: string, enum: [auto, surround, stereo, none] }
        picture: { $ref: "#/components/schemas/PictureMode" }
        track:
          type: string
          enum: [main, language, lang, sap, described, vi]
          description: "Which broadcast audio mix to play. Empty is main. Compared without regard to case. language, lang, and sap are the second language. described and vi are described video. With `caps.alternates`, a watch plays the main encode when that encode carries this mix as an alternate, and the player selects it from the master."
        even: { type: boolean, description: "Level the volume. Off keeps the original mix." }
    MosaicSession:
      type: object
      required: [key, playlist, channelIds, encoder, viewers]
      properties:
        key: { type: string, description: "The channels joined by dashes, for example 4-12." }
        playlist: { type: string, description: "HLS playlist, relative to the server." }
        channelIds:
          type: array
          items: { type: integer, format: int64 }
        encoder: { type: string }
        viewers: { type: integer }
    MultiviewPlan:
      type: object
      required: [playable, blocked, tunersNeeded, tunersFree]
      properties:
        playable:
          type: array
          items:
            type: object
            required: [channelId, frequencyHz, shared]
            properties:
              channelId: { type: integer, format: int64 }
              frequencyHz: { type: integer }
              shared: { type: boolean, description: "True when this channel shares a tuner with another tile." }
        blocked:
          type: array
          items:
            type: object
            required: [channelId, reason, holders]
            properties:
              channelId: { type: integer, format: int64 }
              reason: { type: string }
              holders:
                type: array
                items: { type: string }
        tunersNeeded: { type: integer }
        tunersFree: { type: integer }
        note: { type: string }
        offers:
          type: array
          description: What the add-a-channel picker says about each lineup channel. Present when the request sets picker.
          items:
            type: object
            required: [channelId, cost, label]
            properties:
              channelId: { type: integer, format: int64 }
              cost: { type: string, enum: [same, tuner, none, on] }
              label: { type: string, description: "Same tune as 9.1, Already tuned, Uses a tuner, No tuner free, or No picture free (the server encodes as many pictures as it can)." }
        stops:
          type: array
          description: Tiles a scheduled recording will take. Each tile keeps playing until at.
          items:
            type: object
            required: [channelId, reason, at]
            properties:
              channelId: { type: integer, format: int64 }
              reason: { type: string }
              at: { type: string, format: date-time }
    StreamInfo:
      type: object
      required: [rendition, video, audio, reason]
      properties:
        rendition: { type: string }
        video: { type: string, enum: [copy, "1080", "720", "540", "480", "360"] }
        audio: { type: string, enum: [copy, aac2, aac6, ac3, none] }
        mode: { $ref: "#/components/schemas/PictureMode" }
        reason: { type: string, description: "Short, user-facing explanation of the choice" }
        sourceVideo: { type: string }
        sourceAudio: { type: string }
        encoder: { type: string }
        scan: { type: string, description: "progressive, interlaced, or film" }
        sourceWidth: { type: integer }
        sourceHeight: { type: integer }
        sourceFps: { type: string, description: "Broadcast frame rate, such as 59.94" }
        outputWidth: { type: integer }
        outputHeight: { type: integer }
        outputFps: { type: string }
        bitrate: { type: string, description: "Encoder target, such as 14M" }
        decode: { type: string, description: "gpu or cpu when this rendition is transcoded" }
    WatchSession:
      type: object
      required: [channelId, playlist, rendition, stream, encoder, shared, viewers]
      properties:
        channelId: { type: integer, format: int64 }
        playlist:
          type: string
          description: |
            HLS playlist path, relative to the server origin. Every segment carries
            EXT-X-PROGRAM-DATE-TIME on the channel's shared timeline, identical across renditions.
        mainPlaylist:
          type: string
          description: |
            Multivariant playlist that pairs `playlist` with an English CC WebVTT track, present
            when the server reads the channel's captions. For a watch with `caps.alternates` whose
            rendition carries more than one sound track, it is `master.m3u8` instead: the picture
            view and each sound track as an alternate (plus captions when they run). When adaptive
            quality is on and this watch uses the ladder, it is `ladder.m3u8`: 1080p, 720p, 480p,
            and audio only, from one decode. Players load this one; readiness checks keep reading `playlist`.
        rendition: { type: string }
        stream: { $ref: "#/components/schemas/StreamInfo" }
        profile: { type: string }
        audio: { type: string }
        encoder: { type: string }
        picture: { $ref: "#/components/schemas/PictureMode" }
        videoMode: { type: string }
        shared: { type: boolean }
        viewers: { type: integer }
        frequencyHz: { type: integer }
        program: { type: integer }
        hints:
          type: array
          items: { type: string }
        tuners:
          type: array
          items: { $ref: "#/components/schemas/Tuner" }
        boot:
          type: string
          description: Names the server process that counted this viewer, as in the event socket's `hello`. Send it back with the stop.
    NowChannel:
      type: object
      required: [channelId, progress, art]
      properties:
        channelId: { type: integer, format: int64 }
        now: { $ref: "#/components/schemas/Airing" }
        next: { $ref: "#/components/schemas/Airing" }
        progress: { type: number, minimum: 0, maximum: 1, description: "How far into now the answer's minute is. 0 when nothing is on." }
        art: { type: string, description: "Path on this server of the picture for the row: the listing's when it has one, else the channel's." }
    Recording:
      type: object
      required: [id, channelId, guideNumber, title, status, startedAt]
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        guideNumber: { type: string }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        category: { type: string }
        programId: { type: string }
        gameId: { type: string, description: "Scoreboard game this recording is following. Empty when it is not a matched game." }
        passId: { type: integer, format: int64, description: "The pass that started it; its keep and limit rules apply. Absent for one started by hand or found in a folder." }
        status: { type: string, enum: [recording, complete, failed, stopped, imported, interrupted], description: "`interrupted`: cut short when the server stopped; the file holds the show up to then, and the rest records as a second piece." }
        error: { type: string }
        partial: { type: boolean, description: "Holds only part of its airing: a piece before or after a restart, or a retry after a failure. It does not count as having the episode, so the next airing still records. Absent when false." }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        bytes: { type: integer, format: int64 }
        position: { type: number }
        durationSec: { type: number }
        watched: { type: integer }
        keep: { type: boolean, description: "Kept forever: no clean-up removes it." }
        file: { type: string, description: "The file's name inside the recordings folder, with forward slashes. Missing for a file in a library folder." }
        missing: { type: boolean, description: "The recording finished but its file is gone (moved or deleted outside Broadwave). It cannot play; delete removes it from the list." }
        season: { type: integer, description: "From the listing the recording covers, or an SxxEyy file name in a library folder. Absent when unknown." }
        episode: { type: integer }
        episodeLabel: { type: string, description: "The guide's own episode label when it has one (for example S2E5)." }
        originalAir: { type: string, description: "First air date, YYYY-MM-DD, from the guide." }
        progressAt: { type: string, format: date-time, description: "When the playhead was last saved. Absent when it was never played." }
        introStart: { type: number, description: "Seconds into the file where the show's intro starts, found by comparing its sound with other recordings of the show. Absent when 0." }
        introEnd: { type: number, description: "Seconds into the file where the intro ends. Absent when no intro was found." }
        creditsStart: { type: number, description: "Seconds into the file where the end titles start, or where the show ends before the late padding. Absent when unknown." }
        health:
          $ref: "#/components/schemas/RecordingHealth"
    RecordingHealth:
      type: object
      description: Damage counted in the recording file after it finishes. Absent until then. Zeros mean the file was clean.
      required: [continuityErrors, transportErrors, syncLosses, packets]
      properties:
        continuityErrors: { type: integer, format: int64 }
        transportErrors: { type: integer, format: int64 }
        syncLosses: { type: integer, format: int64 }
        packets: { type: integer, format: int64 }
        gaps: { type: integer, format: int64, description: "Times the stream stopped (the signal dropped), read from the broadcast clock." }
        lostSeconds: { type: number, description: "Seconds of the show lost to those gaps." }
        damaged: { type: boolean, description: "Worth recording again: 5 s or more lost, or 60 or more broken packets. A damaged copy does not keep a pass from recording the next airing of its episode." }
    Marker:
      type: object
      required: [id, start, end]
      properties:
        id: { type: integer, format: int64 }
        recordingId: { type: integer, format: int64 }
        start: { type: number }
        end: { type: number }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: How sure the break scan is. A player skips on its own from 0.7 up and offers the skip below. A marker someone set is 1.
    Pass:
      type: object
      required: [id, title]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        channelId: { type: integer, format: int64 }
        kind: { type: string, description: "series, team, or once" }
        padBefore: { type: integer, minimum: 0, maximum: 30 }
        padAfter: { type: integer, minimum: 0, maximum: 30 }
        priority: { type: integer }
        episodes: { type: string, enum: [all, new] }
        keepMode: { type: string, enum: [all, unwatched, last] }
        keepCount: { type: integer }
        limitCount: { type: integer }
        rerecord: { type: boolean }
        commercials: { type: boolean }
        timeStart: { type: string, description: "HH:MM local" }
        timeEnd: { type: string, description: "HH:MM local" }
        matchKind: { type: string, enum: [title, contains, category, team] }
        days:
          type: array
          description: Weekdays an airing may start on, 0 Sunday to 6 Saturday; empty is every day. After midnight in a window that began the night before counts as that night.
          items: { type: integer, minimum: 0, maximum: 6 }
        airingStart: { type: string, format: date-time, description: "Start of the one airing a once pass records" }
    NewPass:
      type: object
      required: [title]
      properties:
        title: { type: string, description: "The title, the words a title contains, or the category. A blank title, including one that is only spaces, is 400." }
        channelId: { type: integer, format: int64, description: "0 records on any channel" }
        padBefore: { type: integer, minimum: 0, maximum: 30 }
        padAfter: { type: integer, minimum: 0, maximum: 30 }
        airingStart: { type: string, format: date-time, description: "Record only the airing starting then on channelId (kind once). Needs channelId; the rules below are ignored." }
        matchKind: { type: string, enum: [title, contains, category] }
        priority: { type: integer }
        episodes: { type: string, enum: [all, new] }
        keepMode: { type: string, enum: [all, unwatched, last] }
        keepCount: { type: integer, minimum: 0, maximum: 99 }
        limitCount: { type: integer, minimum: 0, maximum: 99 }
        rerecord: { type: boolean }
        commercials: { type: boolean }
        timeStart: { type: string, description: "HH:MM local; set with timeEnd" }
        timeEnd: { type: string, description: "HH:MM local; before timeStart crosses midnight" }
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
    PassPreview:
      type: object
      required: [tunerCount, items, bumps, timeZone, utcOffset]
      properties:
        tunerCount: { type: integer }
        timeZone: { type: string, description: "The server's time zone, which days and times are read in" }
        utcOffset: { type: integer, description: "Seconds the server's clock is ahead of UTC now" }
        items:
          type: array
          description: Airings the pass matches, with skipped ones marked
          items: { $ref: "#/components/schemas/PlannedAiring" }
        bumps:
          type: array
          description: Airings other passes record now that this pass would push out
          items: { $ref: "#/components/schemas/PlannedAiring" }
    TeamFollow:
      type: object
      required: [name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: "A name that is only spaces is 400." }
        short: { type: string }
        abbr: { type: string }
        league: { type: string }
        logo: { type: string }
        color: { type: string }
        record: { type: boolean, description: "Record every game for this team." }
    TeamList:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamFollow" }
    PassList:
      type: object
      required: [passes]
      properties:
        passes:
          type: array
          items: { $ref: "#/components/schemas/Pass" }
    Suggestion:
      type: object
      required: [channelId, title, start, end]
      description: A later airing that fits without bumping another recording.
      properties:
        channelId: { type: integer, format: int64 }
        guideNumber: { type: string }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    PlannedAiring:
      type: object
      required: [passId, airing, priority, padBefore, padAfter, conflict, skipped]
      properties:
        passId: { type: integer, format: int64 }
        airing: { $ref: "#/components/schemas/Airing" }
        priority: { type: integer }
        padBefore: { type: integer }
        padAfter: { type: integer }
        conflict: { type: boolean }
        skipped: { type: boolean }
        reason: { type: string }
        suggestion: { $ref: "#/components/schemas/Suggestion" }
    Event:
      type: object
      required: [id, at, kind, message]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string }
    VirtualChannel:
      type: object
      required: [id, number, name, recordings]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        name: { type: string }
        orderMode: { type: string }
        ruleTitle: { type: string }
        recordings:
          type: array
          items: { type: integer, format: int64 }
    Slot:
      type: object
      required: [recordingId, title, start, end]
      properties:
        recordingId: { type: integer, format: int64 }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    SetupStep:
      type: object
      required: [id, title, state]
      properties:
        id: { type: string }
        title: { type: string }
        state: { type: string, enum: [waiting, running, done, check, skipped], description: "check means the step finished but something needs a look; the detail says what." }
        detail: { type: string }
    SetupFinish:
      type: object
      required: [running, steps]
      properties:
        running: { type: boolean }
        ready: { type: string, description: "Summary once setup has finished, such as Ready: 27 channels, guide for 21, 2 tuners, Intel GPU." }
        channelId: { type: integer, format: int64, description: "First channel to watch. A favorite when one was starred." }
        steps:
          type: array
          items: { $ref: "#/components/schemas/SetupStep" }
    StoragePlan:
      type: object
      required: [deleteWatchedDays, makeRoom, protectFavorites, watermarkGB, freeBytes, reserveBytes, shortBytes, covers, remove, held, again]
      description: What the storage rules would do right now. Nothing is deleted.
      properties:
        deleteWatchedDays: { type: integer, description: "Days a watched recording stays. 0 keeps them." }
        makeRoom: { type: boolean, description: "True when watched recordings would be deleted to get back to the reserve." }
        protectFavorites: { type: boolean, description: "True when recordings on favorite channels are left alone." }
        watermarkGB: { type: integer, description: "The reserve in gigabytes. 0 turns it off." }
        freeBytes: { type: integer, format: int64 }
        reserveBytes: { type: integer, format: int64 }
        shortBytes: { type: integer, format: int64, description: "Bytes still short of the reserve after recordings past their days are counted. 0 when make-room would not run." }
        covers: { type: boolean, description: "False when the watched recordings are not enough to get back to the reserve. None of them would be deleted to make room." }
        roomNote: { type: string, description: "Why make-room would or would not delete." }
        remove:
          type: array
          items: { $ref: "#/components/schemas/StoragePlanItem" }
        held:
          type: array
          items: { $ref: "#/components/schemas/StoragePlanItem" }
        again:
          type: array
          items: { $ref: "#/components/schemas/StoragePlanItem" }
    StoragePlanItem:
      type: object
      required: [id, title, bytes, rule, reason]
      description: One recording a rule would remove, leave alone, or record again.
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        bytes: { type: integer, format: int64 }
        rule:
          type: string
          enum: [watchedDays, makeRoom, keepLast, keepUnwatched, kept, recording, missing, favorite, recent, outside, lostTime]
        reason: { type: string }
        when:
          type: string
          enum: [now, next]
          description: now is a clean-up that runs on its own. next is a keep rule that runs when another episode of that show finishes.
    StorageShows:
      type: object
      required: [shows]
      description: Finished recordings in the recordings folder, grouped by title, largest first.
      properties:
        shows:
          type: array
          items: { $ref: "#/components/schemas/StorageShow" }
    StorageShow:
      type: object
      required: [title, count, bytes, oldest, newest]
      properties:
        title: { type: string }
        count: { type: integer, description: "Finished recordings of this show in the recordings folder." }
        bytes: { type: integer, format: int64 }
        oldest: { type: string, format: date-time }
        newest: { type: string, format: date-time }
        pass: { $ref: "#/components/schemas/StorageKeep" }
    StorageKeep:
      type: object
      required: [id, keep]
      description: The pass that keeps this show, when there is one.
      properties:
        id: { type: integer, format: int64 }
        keep: { type: integer, description: "How many finished recordings the pass keeps. 0 means every one." }
    CatalogBackup:
      type: object
      required: [name, kind, takenAt, bytes]
      properties:
        name: { type: string }
        kind: { type: string, enum: [daily, weekly, version] }
        takenAt: { type: string, format: date-time }
        bytes: { type: integer, format: int64 }
    GameAlert:
      type: object
      required: [id, kind, gameId, channelId, channel, text]
      properties:
        id: { type: string, description: "The game id and kind; each is sent once." }
        kind: { type: string, enum: [start, close] }
        gameId: { type: string }
        channelId: { type: integer, format: int64, description: "The channel to watch it on." }
        channel: { type: string, description: "That channel's number." }
        text: { type: string, description: "\"Starting now: CHI at LV\" or \"Close game: BUF at MIA\"." }
        detail: { type: string, description: "The score and clock of a close finish. A game this home is recording and has not watched gets no close alert at all." }
    Settings:
      type: object
      properties:
        layout: { type: string, enum: [auto, desktop, tv, phone] }
        profile: { type: string, enum: [transparent, balanced, saver] }
        audio: { type: string, enum: [stereo, surround] }
        encoder: { type: string }
        watermarkGB: { type: string, description: "Free-space reserve in GB; 0 turns it off" }
        bufferMinutes: { type: string, enum: ["0", "30", "60", "120", "240"], description: "Minutes of each tuned channel kept on disk, so a recording of a show already on starts from its beginning; 0 turns it off" }
        writeNfo: { type: string, enum: ["0", "1"], description: "1 writes a .nfo file beside each finished recording for Plex, Jellyfin, and Kodi. 0 leaves them off. Missing means off." }
        deleteWatchedDays: { type: string, description: "Days a watched recording stays before it is deleted, 0 to 3650; 0 keeps them. Recordings kept forever and files in library folders stay." }
        makeRoom: { type: string, enum: ["0", "1"], description: "1 deletes the oldest watched recordings when free space falls under the reserve, before a recording is refused. 0 only refuses. Missing means off." }
        protectFavorites: { type: string, enum: ["0", "1"], description: "1 leaves recordings on favorite channels out of clean-up and out of a pass's keep count. 0, the default, cleans them up like any other recording. Keep forever is separate and always on for a recording you mark." }
        folderLayout: { type: string, enum: [shows, flat], description: "Where new recordings go. shows (the default) uses the layout Plex and Jellyfin read: TV/Show/Season 01/Show - S01E02 - Episode.ts when the guide has both a season and an episode number, TV/Show/Show - 2026-10-08 - Episode.ts otherwise (the start time when the episode has no name), and Movies/Title (1999)/Title (1999).ts for a movie (the year only when the guide has one). flat puts every recording in the recordings folder, named by start time and channel. Recordings already made stay where they are." }
        gameAlerts: { type: string, enum: [all, teams, off], description: "Which game alerts the server sends as game.alert events. all (the default) is followed teams' games starting and close finishes; teams is followed teams only; off sends none. Live scores off sends none either." }
        pictureMode: { $ref: "#/components/schemas/PictureMode" }
        adaptive: { type: string, enum: ["0", "1"], description: "1 turns on an adaptive ladder (1080p, 720p, 480p, and audio only) for browsers and Apple. The rungs share one decode. Missing means off." }
        autoplay: { type: string, enum: ["0", "1"] }
        hdhrEmulate: { type: string, enum: ["0", "1"] }
        deviceAuth: { type: string, enum: ["0", "1"], description: "1 requires a device token on the API and on /media. 0, the default, leaves the home network open. A presented token is still recognized while this is off." }
        remoteUrl: { type: string, description: "The https address that reaches this server from outside, such as https://tv.example.com. A bare name gets https. Empty clears it." }
        tunnelToken: { type: string, writeOnly: true, description: "A Cloudflare tunnel token, or the install command that contains it. The server keeps it in the config folder, not the catalog, and runs cloudflared with it. Never returned. Empty clears it and stops the tunnel." }
        tunnelTokenSet: { type: string, enum: ["0", "1"], readOnly: true }
        deviceToken: { type: string, description: "Returned once, on the response that turns deviceAuth on, when the request did not already use an admin token. Not stored. Not returned by GET." }
        exportMosaics: { type: string, description: "Mosaics listed as channels of their own in the M3U, XMLTV, and HDHomeRun exports: mosaic keys joined by commas, for example 4-12,1-2-3 (at most 8). They are numbered 990.1 and up in this order; a mosaic with a channel no longer in the lineup is left out." }
        setupComplete: { type: string, enum: ["0", "1"] }
        needsSetup: { type: string, enum: ["0", "1"], description: "1 when this catalog should show the setup wizard. Set by the server; ignored on write." }
        lastGuidePull: { type: string, format: date-time, description: "When listings last loaded. Set by the server; ignored on write." }
        nextGuidePull: { type: string, format: date-time, description: "When the next automatic listing refresh is due. Set by the server; ignored on write." }
        lastManualGuidePull: { type: string, format: date-time, description: "When listings were last reloaded by hand. Set by the server; ignored on write." }
        lastGuideError: { type: string, description: "Why the last listing load failed. Empty after a load that worked. Set by the server; ignored on write." }
        lastGuideErrorAt: { type: string, format: date-time, description: "When the last listing load failed. Absent after a load that worked. Set by the server; ignored on write." }
        hideScores: { type: string, enum: ["0", "1"] }
        liveScores: { type: string, enum: ["0", "1"], description: "1 asks the scoreboard. 0 stops every scoreboard request. Missing means on." }
        checkUpdates: { type: string, enum: ["0", "1"], description: "1 checks for a newer release once a day. 0 turns the check off. Missing means on." }
        sdUser: { type: string }
        sdPassword: { type: string }
        sdLineup: { type: string }
        sdPasswordSet: { type: string, enum: ["0", "1"] }
        guideUrl: { type: string }
        tmdbKey: { type: string }
        tmdbKeySet: { type: string, enum: ["0", "1"] }
        sportsdbKey: { type: string, description: "The user's TheSportsDB key. Never returned. Empty clears it." }
        sportsdbKeySet: { type: string, enum: ["0", "1"], description: "1 when a TheSportsDB key is saved. Set by the server." }
