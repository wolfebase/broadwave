services:
  broadwave:
    image: ghcr.io/wolfebase/broadwave:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    # Host networking lets a Linux server hear HDHomeRun discovery and lets
    # phones and TVs find the server over Bonjour. On Docker Desktop this
    # network stays inside the virtual machine, so use the published-port
    # command in the README instead.
    network_mode: host
    environment:
      # Your time zone, such as America/Chicago. Pass times and the recording
      # schedule use it. Put TZ=... in a .env file next to this one.
      TZ: ${TZ:?Set TZ to your time zone, such as TZ=America/Chicago, in .env next to compose.yaml}
      # The user and group that own config and recordings. Unraid uses 99 and 100.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: "022"
      # HDHR_HOST: 192.168.1.50   # only if discovery cannot reach the tuner
      # BROADWAVE_CAST_APP_ID: "" # Google Cast application id. Empty hides Cast.
      # The secure name (HTTPS and HTTP/2 on port 8443, a Let's Encrypt name
      # for the home network) is on by default; host networking covers the port.
      # BROADWAVE_DIRECT: "0"     # turn it off
    volumes:
      - ./config:/config
      - ./recordings:/config/work/recordings
    # Intel or AMD graphics for hardware transcoding. Docker refuses to start
    # a container whose device is missing, and most ARM NAS boxes have none,
    # so this is off by default. When `ls /dev/dri` lists renderD128, remove
    # the # from the next two lines. Diagnostics says so when the host has
    # graphics the container can't use.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
    labels:
      # Read only by the optional updater below.
      com.centurylinklabs.watchtower.enable: "true"
      # Exits 75 (skip tonight) while a tuner is in use, a recording is running,
      # or a recording starts within two hours. If the server does not answer,
      # the update proceeds.
      com.centurylinklabs.watchtower.lifecycle.pre-update: broadwave -update-check
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "1"

  # Optional: keeps Broadwave on the newest release, checking nightly at 03:30.
  # Turn it on with `docker compose --profile updater up -d`. It updates only
  # containers labeled above, and never while Broadwave is busy.
  updater:
    image: nickfedor/watchtower:1
    profiles: [updater]
    environment:
      TZ: ${TZ:?Set TZ to your time zone, such as TZ=America/Chicago, in .env next to compose.yaml}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      WATCHTOWER_SCHEDULE: "0 30 3 * * *"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
