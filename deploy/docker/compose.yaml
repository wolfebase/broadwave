services:
  broadwave:
    image: ghcr.io/wolfebase/broadwave:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    # Host networking lets a Linux server hear HDHomeRun discovery and lets
    # phones and TVs find the server over Bonjour. On Docker Desktop this
    # network stays inside the virtual machine, so use the published-port
    # command in the README instead.
    network_mode: host
    environment:
      TZ: UTC
      PUID: "99"
      PGID: "100"
      UMASK: "022"
      # HDHR_HOST: 192.168.1.50   # only if discovery cannot reach the tuner
    volumes:
      - ./config:/config
      - ./recordings:/config/work/recordings
    # Intel or AMD graphics for hardware transcoding. Remove if not present.
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
